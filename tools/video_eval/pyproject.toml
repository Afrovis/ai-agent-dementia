[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-eval"
version = "0.1.0"
description = "Offline recorded-video evaluation tools for Night Companion"
requires-python = ">=3.12"
dependencies = [
    "pillow>=10.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["video_eval*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
pythonpath = [".", "../../services/capture", "../../services/perceive", "../../shared"]
testpaths = ["tests"]
