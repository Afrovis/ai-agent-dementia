services:
  bus:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - bus-data:/data

  store:
    build:
      context: .
      dockerfile: services/store/Dockerfile
    restart: unless-stopped
    depends_on:
      - bus
    env_file: .env
    environment:
      REDIS_URL: ${REDIS_URL}
      DB_PATH: ${DB_PATH}
      TZ: ${TZ}
      MORNING_SUMMARY_TIME: ${MORNING_SUMMARY_TIME:-08:00}
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro

  capture:
    build:
      context: .
      dockerfile: services/capture/Dockerfile
    restart: unless-stopped
    depends_on:
      - bus
    env_file: .env
    environment:
      REDIS_URL: ${REDIS_URL}
      CAPTURE_SOURCE: ${CAPTURE_SOURCE}
      CAPTURE_DEVICE: ${CAPTURE_DEVICE}
      CAPTURE_FPS: ${CAPTURE_FPS}
      CAPTURE_IDLE_FPS: ${CAPTURE_IDLE_FPS}
      CAPTURE_STATIC_SECONDS: ${CAPTURE_STATIC_SECONDS}
      CAPTURE_MOTION_THRESHOLD: ${CAPTURE_MOTION_THRESHOLD}
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro

  perceive:
    build:
      context: .
      dockerfile: services/perceive/Dockerfile
    restart: unless-stopped
    depends_on:
      - bus
    env_file: .env
    environment:
      REDIS_URL: ${REDIS_URL}
      OLLAMA_URL: ${OLLAMA_URL}
      PERCEIVE_POSE_BACKEND: ${PERCEIVE_POSE_BACKEND}
      PERCEIVE_MIN_CONFIDENCE: ${PERCEIVE_MIN_CONFIDENCE}
      PERCEIVE_CONFIRM_FRAMES: ${PERCEIVE_CONFIRM_FRAMES}
      PERCEIVE_BED_HOLD_SECONDS: ${PERCEIVE_BED_HOLD_SECONDS}
      PERCEIVE_WALK_THRESHOLD: ${PERCEIVE_WALK_THRESHOLD}
      PERCEIVE_HEARTBEAT_SECONDS: ${PERCEIVE_HEARTBEAT_SECONDS}
      ZONES_PATH: ${ZONES_PATH}
      PERCEIVE_VISION_ENABLED: ${PERCEIVE_VISION_ENABLED}
      PERCEIVE_VISION_MODEL: ${PERCEIVE_VISION_MODEL}
      PERCEIVE_VISION_INTERVAL_SECONDS: ${PERCEIVE_VISION_INTERVAL_SECONDS}
      PERCEIVE_VISION_TIMEOUT_SECONDS: ${PERCEIVE_VISION_TIMEOUT_SECONDS}
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro

  listen:
    build:
      context: .
      dockerfile: services/listen/Dockerfile
    restart: unless-stopped
    depends_on:
      - bus
    env_file: .env
    environment:
      REDIS_URL: ${REDIS_URL}
      LISTEN_MODEL: ${LISTEN_MODEL:-small.en}
      LISTEN_MODEL_CACHE: ${LISTEN_MODEL_CACHE:-/app/data/models/faster-whisper}
      LISTEN_DEVICE: ${LISTEN_DEVICE:-cpu}
      LISTEN_COMPUTE_TYPE: ${LISTEN_COMPUTE_TYPE:-int8}
      LISTEN_VAD_AGGRESSIVENESS: ${LISTEN_VAD_AGGRESSIVENESS:-2}
      LISTEN_END_SILENCE_MS: ${LISTEN_END_SILENCE_MS:-600}
      LISTEN_MIN_SPEECH_MS: ${LISTEN_MIN_SPEECH_MS:-180}
      LISTEN_MAX_UTTERANCE_SECONDS: ${LISTEN_MAX_UTTERANCE_SECONDS:-15}
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro

  agent:
    build:
      context: .
      dockerfile: services/agent/Dockerfile
    restart: unless-stopped
    depends_on:
      - bus
    env_file: .env
    environment:
      REDIS_URL: ${REDIS_URL}
      OLLAMA_URL: ${OLLAMA_URL}
      AGENT_LLM_MODEL: ${AGENT_LLM_MODEL:-llama3.1:8b}
      AGENT_LLM_TIMEOUT_SECONDS: ${AGENT_LLM_TIMEOUT_SECONDS:-10}
      # The night window is local time; containers default to UTC, so this
      # must be set for AGENT_NIGHT_START/END to mean what they say.
      TZ: ${TZ}
      AGENT_NIGHT_START: ${AGENT_NIGHT_START}
      AGENT_NIGHT_END: ${AGENT_NIGHT_END}
      AGENT_OBSERVE_SECONDS: ${AGENT_OBSERVE_SECONDS}
      AGENT_COOLDOWN_SECONDS: ${AGENT_COOLDOWN_SECONDS}
      AGENT_IN_BED_STABLE_SECONDS: ${AGENT_IN_BED_STABLE_SECONDS}
      AGENT_FLOOR_LIMIT_SECONDS: ${AGENT_FLOOR_LIMIT_SECONDS}
      AGENT_ABSENT_LIMIT_SECONDS: ${AGENT_ABSENT_LIMIT_SECONDS}
      AGENT_RESTROOM_TIMEOUT_SECONDS: ${AGENT_RESTROOM_TIMEOUT_SECONDS}
      AGENT_ZONE_CONFIRM_READINGS: ${AGENT_ZONE_CONFIRM_READINGS}
      AGENT_SAY_MIN_GAP_SECONDS: ${AGENT_SAY_MIN_GAP_SECONDS}
      STRATEGIES_PATH: ${STRATEGIES_PATH}
      PERSON_PATH: ${PERSON_PATH:-/app/config/person.yaml}
      AGENT_FAKE: ${AGENT_FAKE}
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro

  light:
    build:
      context: .
      dockerfile: services/light/Dockerfile
    restart: unless-stopped
    depends_on:
      - bus
    env_file: .env
    environment:
      REDIS_URL: ${REDIS_URL}
      LIGHT_ENABLED: ${LIGHT_ENABLED:-false}
      LIGHT_BACKEND: ${LIGHT_BACKEND:-shelly}
      LIGHT_DEVICE_URL: ${LIGHT_DEVICE_URL:-}
      LIGHT_SWITCH_ID: ${LIGHT_SWITCH_ID:-0}
      LIGHT_TIMEOUT_SECONDS: ${LIGHT_TIMEOUT_SECONDS:-3}
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro

  embodiment:
    build:
      context: .
      dockerfile: services/embodiment/Dockerfile
    restart: unless-stopped
    depends_on:
      - bus
    env_file: .env
    environment:
      REDIS_URL: ${REDIS_URL}
      EMBODIMENT_PORT: ${EMBODIMENT_PORT}
      CERT_FILE: ${CERT_FILE}
      CERT_KEY: ${CERT_KEY}
      PHOTO_DIR: ${PHOTO_DIR}
      PIPER_VOICE_MODEL: ${PIPER_VOICE_MODEL:-/app/models/piper/en_US-lessac-medium.onnx}
      PIPER_CACHE_DIR: ${PIPER_CACHE_DIR:-/tmp/night-companion-tts}
      PIPER_SPEED: ${PIPER_SPEED:-0.85}
      STRATEGIES_PATH: ${STRATEGIES_PATH}
      PERSON_PATH: ${PERSON_PATH:-/app/config/person.yaml}
    ports:
      - "${EMBODIMENT_PORT}:${EMBODIMENT_PORT}"
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro

  notify:
    build:
      context: .
      dockerfile: services/notify/Dockerfile
    restart: unless-stopped
    depends_on:
      - bus
    env_file: .env
    environment:
      REDIS_URL: ${REDIS_URL}
      NTFY_URL: ${NTFY_URL}
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro

  dashboard:
    build:
      context: .
      dockerfile: services/dashboard/Dockerfile
    restart: unless-stopped
    depends_on:
      - bus
    env_file: .env
    environment:
      REDIS_URL: ${REDIS_URL}
      DASHBOARD_PORT: ${DASHBOARD_PORT}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
      ZONES_PATH: ${ZONES_PATH}
      PERSON_PATH: ${PERSON_PATH:-/app/config/person.yaml}
      STRATEGIES_PATH: ${STRATEGIES_PATH}
      PHOTO_DIR: ${PHOTO_DIR}
      VOICE_CLIP_DIR: ${VOICE_CLIP_DIR:-/app/data/voice-clips}
      DB_PATH: ${DB_PATH}
      TZ: ${TZ}
    ports:
      - "${DASHBOARD_PORT}:${DASHBOARD_PORT}"
    volumes:
      - ./data:/app/data
      # Not `:ro` like the other services: the Zones editor (issue #10)
      # writes config/zones.yaml here. `dashboard` is the only service
      # that writes into `config/`.
      - ./config:/app/config

volumes:
  bus-data:
