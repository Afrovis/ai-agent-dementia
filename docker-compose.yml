services:
  bus:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - bus-data:/data

  store:
    build:
      context: .
      dockerfile: services/store/Dockerfile
    restart: unless-stopped
    depends_on:
      - bus
    env_file: .env
    environment:
      REDIS_URL: ${REDIS_URL}
      DB_PATH: ${DB_PATH}
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro

  capture:
    build:
      context: .
      dockerfile: services/capture/Dockerfile
    restart: unless-stopped
    depends_on:
      - bus
    env_file: .env
    environment:
      REDIS_URL: ${REDIS_URL}
      CAPTURE_SOURCE: ${CAPTURE_SOURCE}
      CAPTURE_DEVICE: ${CAPTURE_DEVICE}
      CAPTURE_FPS: ${CAPTURE_FPS}
      CAPTURE_IDLE_FPS: ${CAPTURE_IDLE_FPS}
      CAPTURE_STATIC_SECONDS: ${CAPTURE_STATIC_SECONDS}
      CAPTURE_MOTION_THRESHOLD: ${CAPTURE_MOTION_THRESHOLD}
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro

  perceive:
    build:
      context: .
      dockerfile: services/perceive/Dockerfile
    restart: unless-stopped
    depends_on:
      - bus
    env_file: .env
    environment:
      REDIS_URL: ${REDIS_URL}
      OLLAMA_URL: ${OLLAMA_URL}
      PERCEIVE_POSE_BACKEND: ${PERCEIVE_POSE_BACKEND}
      PERCEIVE_MIN_CONFIDENCE: ${PERCEIVE_MIN_CONFIDENCE}
      PERCEIVE_CONFIRM_FRAMES: ${PERCEIVE_CONFIRM_FRAMES}
      PERCEIVE_BED_HOLD_SECONDS: ${PERCEIVE_BED_HOLD_SECONDS}
      PERCEIVE_WALK_THRESHOLD: ${PERCEIVE_WALK_THRESHOLD}
      PERCEIVE_HEARTBEAT_SECONDS: ${PERCEIVE_HEARTBEAT_SECONDS}
      ZONES_PATH: ${ZONES_PATH}
      PERCEIVE_VISION_ENABLED: ${PERCEIVE_VISION_ENABLED}
      PERCEIVE_VISION_MODEL: ${PERCEIVE_VISION_MODEL}
      PERCEIVE_VISION_INTERVAL_SECONDS: ${PERCEIVE_VISION_INTERVAL_SECONDS}
      PERCEIVE_VISION_TIMEOUT_SECONDS: ${PERCEIVE_VISION_TIMEOUT_SECONDS}
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro

  listen:
    build:
      context: .
      dockerfile: services/listen/Dockerfile
    restart: unless-stopped
    depends_on:
      - bus
    env_file: .env
    environment:
      REDIS_URL: ${REDIS_URL}
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro

  agent:
    build:
      context: .
      dockerfile: services/agent/Dockerfile
    restart: unless-stopped
    depends_on:
      - bus
    env_file: .env
    environment:
      REDIS_URL: ${REDIS_URL}
      OLLAMA_URL: ${OLLAMA_URL}
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro

  embodiment:
    build:
      context: .
      dockerfile: services/embodiment/Dockerfile
    restart: unless-stopped
    depends_on:
      - bus
    env_file: .env
    environment:
      REDIS_URL: ${REDIS_URL}
      EMBODIMENT_PORT: ${EMBODIMENT_PORT}
      CERT_FILE: ${CERT_FILE}
      CERT_KEY: ${CERT_KEY}
      PHOTO_DIR: ${PHOTO_DIR}
    ports:
      - "${EMBODIMENT_PORT}:${EMBODIMENT_PORT}"
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro

  notify:
    build:
      context: .
      dockerfile: services/notify/Dockerfile
    restart: unless-stopped
    depends_on:
      - bus
    env_file: .env
    environment:
      REDIS_URL: ${REDIS_URL}
      NTFY_URL: ${NTFY_URL}
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro

  dashboard:
    build:
      context: .
      dockerfile: services/dashboard/Dockerfile
    restart: unless-stopped
    depends_on:
      - bus
    env_file: .env
    environment:
      REDIS_URL: ${REDIS_URL}
      DASHBOARD_PORT: ${DASHBOARD_PORT}
    ports:
      - "${DASHBOARD_PORT}:${DASHBOARD_PORT}"
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro

volumes:
  bus-data:
