services:
  bus:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - bus-data:/data

  store:
    build:
      context: .
      dockerfile: services/store/Dockerfile
    restart: unless-stopped
    depends_on:
      - bus
    env_file: .env
    environment:
      REDIS_URL: ${REDIS_URL}
      DB_PATH: ${DB_PATH}
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro

  capture:
    build:
      context: .
      dockerfile: services/capture/Dockerfile
    restart: unless-stopped
    depends_on:
      - bus
    env_file: .env
    environment:
      REDIS_URL: ${REDIS_URL}
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro

  perceive:
    build:
      context: .
      dockerfile: services/perceive/Dockerfile
    restart: unless-stopped
    depends_on:
      - bus
    env_file: .env
    environment:
      REDIS_URL: ${REDIS_URL}
      OLLAMA_URL: ${OLLAMA_URL}
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro

  listen:
    build:
      context: .
      dockerfile: services/listen/Dockerfile
    restart: unless-stopped
    depends_on:
      - bus
    env_file: .env
    environment:
      REDIS_URL: ${REDIS_URL}
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro

  agent:
    build:
      context: .
      dockerfile: services/agent/Dockerfile
    restart: unless-stopped
    depends_on:
      - bus
    env_file: .env
    environment:
      REDIS_URL: ${REDIS_URL}
      OLLAMA_URL: ${OLLAMA_URL}
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro

  embodiment:
    build:
      context: .
      dockerfile: services/embodiment/Dockerfile
    restart: unless-stopped
    depends_on:
      - bus
    env_file: .env
    environment:
      REDIS_URL: ${REDIS_URL}
      EMBODIMENT_PORT: ${EMBODIMENT_PORT}
      CERT_FILE: ${CERT_FILE}
      CERT_KEY: ${CERT_KEY}
    ports:
      - "${EMBODIMENT_PORT}:${EMBODIMENT_PORT}"
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro

  notify:
    build:
      context: .
      dockerfile: services/notify/Dockerfile
    restart: unless-stopped
    depends_on:
      - bus
    env_file: .env
    environment:
      REDIS_URL: ${REDIS_URL}
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro

  dashboard:
    build:
      context: .
      dockerfile: services/dashboard/Dockerfile
    restart: unless-stopped
    depends_on:
      - bus
    env_file: .env
    environment:
      REDIS_URL: ${REDIS_URL}
      DASHBOARD_PORT: ${DASHBOARD_PORT}
    ports:
      - "${DASHBOARD_PORT}:${DASHBOARD_PORT}"
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro

volumes:
  bus-data:
