[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dashboard"
version = "0.1.0"
description = "Night Companion caregiver dashboard"
requires-python = ">=3.12"
dependencies = [
    "redis>=5.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx2",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["dashboard*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
# `../perceive` lets `tests/test_zones_store.py` import the real
# `perceive.zones.load_zones` to check a file this service writes is read
# back unchanged -- see `dashboard/zones_store.py`'s module docstring for
# why that is a test-only import, not a runtime dependency.
pythonpath = [".", "../perceive"]
testpaths = ["tests"]
