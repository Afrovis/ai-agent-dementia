<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Night Companion</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div id="brightness-overlay"></div>
  <div id="media-status"></div>
  <div id="clients-warning" class="hidden" role="alert"></div>
  <div id="debug-override-badge" class="hidden" role="status"></div>

  <main id="stage">
    <div id="photo" class="hidden">
      <img id="photo-img" alt="" />
    </div>

    <section id="face-area">
      <div id="face" class="face asleep" role="img" aria-label="companion face">
        <div class="eye eye-left"></div>
        <div class="eye eye-right"></div>
        <div class="mouth"></div>
      </div>
    </section>

    <section id="text-area">
      <h1 id="headline">Good night</h1>
      <p id="body-text"></p>
    </section>
  </main>

  <div id="audio-unlock" class="hidden" role="dialog" aria-label="Turn on voice playback">
    <button id="audio-unlock-button" type="button">Tap to turn on the voice</button>
  </div>

  <aside id="debug" class="hidden" aria-label="Pipeline debug overlay">
    <div class="debug-title">PIPELINE <span id="debug-clock"></span></div>
    <div id="debug-override-banner" class="hidden" role="status"></div>
    <section id="debug-controls" class="hidden" aria-label="Operator debug controls">
      <div class="debug-title">OPERATOR CONTROLS</div>
      <div class="debug-control-row"><span id="agent-clock">Agent clock --:--</span></div>
      <div class="debug-control-row">
        <button type="button" data-offset="-1">−1h</button>
        <button type="button" data-offset="1">+1h</button>
        <button type="button" data-offset="0">Reset</button>
      </div>
      <div class="debug-control-row"><button id="force-in-bed" type="button">Force in bed: OFF</button></div>
      <div id="bed-zone-label">Bed zone: waiting for status</div>
      <div id="bed-zone-detail"></div>
      <button id="detect-bed" class="hidden" type="button">Detect bed zone</button>
    </section>
    <canvas id="debug-camera" width="320" height="180"></canvas>
    <div id="debug-pose-label">camera off</div>
    <div class="debug-status"><span id="debug-person" class="state-chip">unknown</span> <span id="debug-person-detail"></span></div>
    <div id="debug-session">Session: unknown</div>
    <div id="debug-client">Page: connecting</div>
    <div id="debug-clients">0 pages connected</div>
    <div id="debug-indicators"></div>
    <div class="debug-title">EVENTS</div>
    <div id="debug-events"></div>
  </aside>

  <script src="/static/script.js"></script>
</body>
</html>
