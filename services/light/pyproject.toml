[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "night-companion-light"
version = "0.1.0"
description = "Night Companion hallway smart-plug service"
requires-python = ">=3.12"
dependencies = [
    "redis>=5.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
include = ["light*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
pythonpath = [".", "../../shared"]
testpaths = ["tests"]
