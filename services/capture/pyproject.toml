[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capture"
version = "0.1.0"
description = "Night Companion capture service: motion-gated frame receiver (issue #7)"
requires-python = ">=3.12"
dependencies = [
    "redis>=5.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
# The browser MVP source needs none of this. Only install it if
# CAPTURE_SOURCE is "usb" or "rtsp".
camera = [
    "opencv-python-headless>=4.9",
]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["capture*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
