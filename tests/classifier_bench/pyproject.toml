[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "classifier-bench"
version = "0.1.0"
description = "Per-action classification probe for the Night Companion decision benchmark"
requires-python = ">=3.12"
dependencies = [
    "decision-bench",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["classifier_bench*"]

[tool.setuptools.package-data]
classifier_bench = ["probe_prompt.md", "choice_prompt.md"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
pythonpath = [".", "../decision_bench"]
testpaths = ["tests"]
