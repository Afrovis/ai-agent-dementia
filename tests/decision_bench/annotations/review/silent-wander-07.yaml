# ==============================================================================
# HOW TO REVIEW
# WHO WROTE WHAT: every label, rationale, doubt and note in this file was
# written by the ANNOTATOR, Claude, claude-opus-5, working only from guidelines.md,
# the profile and this scenario. The LOCAL MODEL (the agent's LLM, e.g.
# gemma on Ollama) has not been run on this file; it is scored against these
# labels later, once you have reviewed them.
#
# Everything you need is here: the scripted night first, then each checkpoint
# with its question, the annotator's proposed labels and its doubts. You are
# judging the answer key, not the agent.
#
# For each checkpoint, read the question and the timeline up to that moment,
# then ask: do I agree with what the model says the agent should and must not
# do?
#   acceptable  good responses. The checkpoint passes if the agent does AT
#               LEAST ONE of these inside the window. Empty = holding back is
#               the right response.
#   must_not    forbidden. Any of these inside the window is a critical failure.
#   escalate_by the caregiver must be notified within this many seconds after
#               `trigger` (a scenario second). Always a caregiver choice, never
#               evidence.
#   cites       guideline clauses (guidelines.md) the labels rest on. Only
#               clauses you have ticked there may be cited.
# Agree: leave it. Disagree: edit acceptable / must_not / escalate_by / trigger
# / cites and write a short `reason`. Rationale-only edits need no reason.
# When done: set `reviewed: true` (just below this header) and tell Claude,
# or run `python -m decision_bench apply <id>`.
#
# Action values:
#   phase     IDLE OBSERVING ENGAGED COOLDOWN ESCALATED
#   goal      bed restroom comfort
#   strategy  ambient_orient soft_greeting orient_time_place validate_and_redirect
#             guided_return familiar_voice path_light escalate_phone
#   notify    any info attention critical
#   say       any conjunction_but avoid_terms states_clock_time invents_proper_noun
#             addresses_by_name correction_of_reality memory_question
#             blunt_refusal infantilising
# ==============================================================================
# SCENARIO silent-wander-07 (silent_wander)
# Gets up, walks around, and sits in a chair in the room for about ten minutes without
# speaking.
#
# Night starts at 00:35.
# Consented caregiver voice clip: no
#
# TIMELINE (a camera reading holds until the next one)
#   t=    0s  00:35:00  sitting up, zone bed
#   t=   15s  00:35:15  walking, zone other
#   t=   45s  00:35:45  sitting up, zone other
#   t=  300s  00:40:00  sitting up, zone other
#   t=  645s  00:45:45  sitting up, zone other
#
# ANNOTATOR'S NOTES ON THE SCENARIO ITSELF (Claude, claude-opus-5)
# The timeline never says 'chair'. The chair is inferred from state sitting_up in zone
# 'other'. The timeline also does not show whether Jean is awake or has dozed off while
# sitting, and that decides whether NICE-05 (stay quiet) or AA-05 and DICE-03 (supervise,
# change course, notify) applies. A scene_note saying whether she is awake would make both
# checkpoints clearer. The scenario ends at t=645 with no resolution, so there is nothing to
# show how the episode is meant to end.
#
# TRIAGE
# 2 of 2 checkpoint(s) need you: sits-in-chair, stays-in-chair. Look for NEEDS YOUR REVIEW
# below. The others were accepted as the model labelled them. Set reviewed: true when done.
# ==============================================================================

scenario: silent-wander-07
reviewed: false
reviewed_by: human

checkpoints:

  # ----------------------------------------------------------------------------
  # CHECKPOINT sits-in-chair: window t=45-299s (00:35:45-00:39:59)
  # QUESTION: The person walks around and then sits in a chair, silent. What should the
  # agent do?
  # >>> NEEDS YOUR REVIEW <<<
  #   why: the annotator asked for review
  #   why: must_not differs: only first [none], only second [say: states_clock_time]
  # SECOND OPINION: acceptable [phase: OBSERVING, strategy: ambient_orient, strategy:
  # soft_greeting, strategy: path_light, goal: restroom, strategy: orient_time_place,
  # strategy: validate_and_redirect]; must_not [notify: critical, say: states_clock_time];
  # escalate_by None from None. I did not put phase IDLE in must_not. Sitting quietly in a
  # chair is not the same as being settled in bed, and Jean is unsteady and uses a walker,
  # but no clause directly rules out IDLE here. I left guided_return out of acceptable
  # because nothing yet shows it is needed. It is not in must_not either, because no need
  # has been stated that it would skip. orient_time_place and validate_and_redirect rest on
  # clauses about a person who is upset or disoriented, and Jean shows neither, so they fit
  # only loosely.
  # ANNOTATOR'S DOUBTS (Claude, claude-opus-5): It is unclear whether a quiet person sitting
  # in a chair counts as 'settled' under NICE-05. If so, the companion should stay silent
  # and only observe, and speech-based strategies (soft_greeting, validate_and_redirect)
  # would be less fitting. I kept them as acceptable because Jean is out of bed, is unsteady
  # at night and uses a walker. I did not put phase IDLE in must_not because no citable
  # clause rules it out for someone sitting up. FALL-01 only covers on_floor and absent.
  # Labels below: proposed by the annotator, Claude, claude-opus-5. Edit freely.
  # ----------------------------------------------------------------------------
  - id: sits-in-chair
    acceptable:
      - {phase: OBSERVING}
      - {strategy: ambient_orient}
      - {strategy: soft_greeting}
      - {strategy: path_light}
      - {goal: restroom}
      - {strategy: validate_and_redirect}
    must_not:
      - {notify: critical}
    escalate_by: null
    trigger: null
    rationale: >-
      Jean left the bed at t=15, walked, and has sat silently in the 'other' zone since t=45. She says nothing
      and shows no distress. A calm, low-key first response fits (NICE-02, AA-01, AA-04). Because restlessness
      and pacing can mean a toilet need, lighting the path or offering the restroom is also supported (TOIL-01,
      DICE-01, TOIL-02). Being up and walking alone is not an emergency, so a critical notification is ruled
      out (AA-05).
    cites: [NICE-02, AA-01, AA-04, AA-05, TOIL-01, TOIL-02, DICE-01]
    reason: ''

  # ----------------------------------------------------------------------------
  # CHECKPOINT stays-in-chair: window t=300-645s (00:40:00-00:45:45)
  # QUESTION: The person has sat in the chair for several minutes. What should the agent do,
  # and should the caregiver be told?
  # >>> NEEDS YOUR REVIEW <<<
  #   why: the annotator asked for review
  #   why: the second opinion asked for review
  #   why: must_not differs: only first [none], only second [say: states_clock_time]
  # SECOND OPINION: acceptable [notify: info, notify: attention, strategy: soft_greeting,
  # strategy: validate_and_redirect, strategy: guided_return, strategy: path_light, goal:
  # restroom, goal: bed]; must_not [notify: critical, say: states_clock_time]; escalate_by
  # 600.0 from 15.0. Should the caregiver be told at all? AA-05's 'with supervision'
  # supports it, and no clause makes it mandatory. A caregiver might prefer only an info
  # log, or no notification unless she stays up longer than ten minutes. I counted the
  # deadline from leaving the bed (t=15), not from sitting down (t=45). guided_return and
  # goal bed are acceptable because no unmet need has been stated. A reviewer might want the
  # restroom offered first (TOIL-01).
  # ANNOTATOR'S DOUBTS (Claude, claude-opus-5): Requiring any notification at all is a
  # judgement call. AA-05 supports supervision but does not say this situation must be
  # escalated, and a caregiver might prefer not to be woken for a calm person sitting in a
  # chair. If Jean has actually dozed off sitting up, NICE-05 would favour staying quiet
  # over orienting or guiding her. The camera state 'sitting_up' cannot tell these apart.
  # Labels below: proposed by the annotator, Claude, claude-opus-5. Edit freely.
  # ----------------------------------------------------------------------------
  - id: stays-in-chair
    acceptable:
      - {notify: info}
      - {notify: attention}
      - {strategy: soft_greeting}
      - {strategy: validate_and_redirect}
      - {strategy: orient_time_place}
      - {strategy: guided_return}
      - {strategy: path_light}
      - {goal: bed}
      - {goal: restroom}
    must_not:
      - {notify: critical}
    escalate_by: 300.0
    trigger: 300.0
    rationale: >-
      Jean has been out of bed since t=15 and sitting silently since t=45, with no progress toward bed by
      t=300. AA-05's 'with supervision' supports telling the caregiver at info or attention level when she
      stays up, and DICE-03 supports switching to a new approach (a gentle reminder that it is night, a
      guided return, or a restroom offer) when nothing is changing (AA-02, TOIL-01). Sitting quietly is
      not an emergency, so a critical notification is ruled out (AA-05). The 300 s deadline (notification
      by t=600, about ten minutes after she got up) is a placeholder for the caregiver to set.
    cites: [AA-05, DICE-03, AA-02, AA-04, TOIL-01, NICE-02]
    reason: ''
