# ==============================================================================
# HOW TO REVIEW
# WHO WROTE WHAT: every label, rationale, doubt and note in this file was
# written by the ANNOTATOR, Claude, claude-opus-5, working only from guidelines.md,
# the profile and this scenario. The LOCAL MODEL (the agent's LLM, e.g.
# gemma on Ollama) has not been run on this file; it is scored against these
# labels later, once you have reviewed them.
#
# Everything you need is here: the scripted night first, then each checkpoint
# with its question, the annotator's proposed labels and its doubts. You are
# judging the answer key, not the agent.
#
# For each checkpoint, read the question and the timeline up to that moment,
# then ask: do I agree with what the model says the agent should and must not
# do?
#   acceptable  good responses. The checkpoint passes if the agent does AT
#               LEAST ONE of these inside the window. Empty = holding back is
#               the right response.
#   must_not    forbidden. Any of these inside the window is a critical failure.
#   escalate_by the caregiver must be notified within this many seconds after
#               `trigger` (a scenario second). Always a caregiver choice, never
#               evidence.
#   cites       guideline clauses (guidelines.md) the labels rest on. Only
#               clauses you have ticked there may be cited.
# Agree: leave it. Disagree: edit acceptable / must_not / escalate_by / trigger
# / cites and write a short `reason`. Rationale-only edits need no reason.
# When done: set `reviewed: true` (just below this header) and tell Claude,
# or run `python -m decision_bench apply <id>`.
#
# Action values:
#   phase     IDLE OBSERVING ENGAGED COOLDOWN ESCALATED
#   goal      bed restroom comfort
#   strategy  ambient_orient soft_greeting orient_time_place validate_and_redirect
#             guided_return familiar_voice path_light escalate_phone
#   notify    any info attention critical
#   say       any conjunction_but avoid_terms states_clock_time invents_proper_noun
#             addresses_by_name correction_of_reality memory_question
#             blunt_refusal infantilising
# ==============================================================================
# SCENARIO false-alarm-06 (false_alarm)
# Sits up in bed reading late in the evening and says they will just finish their chapter.
#
# Night starts at 23:15.
# Consented caregiver voice clip: no
#
# TIMELINE (a camera reading holds until the next one)
#   t=    0s  23:15:00  sitting up, zone bed; camera note: person is reading a book
#   t=   60s  23:16:00  says "I'll just finish my chapter."
#   t=  120s  23:17:00  sitting up, zone bed; camera note: person is reading a book
#   t=  420s  23:22:00  in bed, zone bed
#   t=  560s  23:24:20  in bed, zone bed
#
# ANNOTATOR'S NOTES ON THE SCENARIO ITSELF (Claude, claude-opus-5)
# The reading window runs up to t=419, and the camera still reports sitting_up from t=120
# until the in_bed reading at t=420. So the moment she lies down falls exactly at the start
# of the second window, which fits the questions. The scenario does not say whether her
# remark at t=60 was meant for the companion.
#
# TRIAGE
# 2 of 2 checkpoint(s) need you: reading, lies-down. Look for NEEDS YOUR REVIEW below. The
# others were accepted as the model labelled them. Set reviewed: true when done.
# ==============================================================================

scenario: false-alarm-06
reviewed: false
reviewed_by: human

checkpoints:

  # ----------------------------------------------------------------------------
  # CHECKPOINT reading: window t=0-419s (23:15:00-23:21:59)
  # QUESTION: The person is sitting up in bed reading, content. What should the agent do,
  # and what must it not do?
  # >>> NEEDS YOUR REVIEW <<<
  #   why: the annotator asked for review
  #   why: the second opinion asked for review
  #   why: must_not differs: only first [notify: attention], only second [none]
  # SECOND OPINION: acceptable [none]; must_not [strategy: guided_return, strategy:
  # escalate_phone, phase: ESCALATED, notify: critical]; escalate_by None from None. No
  # clause directly covers a person who is awake, content and still in bed. AA-05 is about
  # pacing, and NICE-01/AA-01 are about distress, so these must_not labels rest on analogy.
  # I did not add say: any to must_not. Jean's remark could be addressed to the companion,
  # and a brief warm reply is not clearly ruled out. A reviewer might want silence enforced
  # here. I also left orient_time_place and notify info/attention out of must_not, because
  # the pack does not clearly forbid them.
  # ANNOTATOR'S DOUBTS (Claude, claude-opus-5): Putting guided_return in must_not is my own
  # reading of NICE-05 and PCC-02. No clause directly forbids gently suggesting sleep to
  # someone who is awake and content, so a reviewer could move it down to second-best. I
  # left notify info out of must_not because a note for the record seems harmless, but a
  # strict reading of NICE-05 would rule out any notification. Her remark may have been
  # meant for the companion, so a single short, warm reply is not ruled out. If the reviewer
  # wants silence here, they could add say any to must_not.
  # Labels below: proposed by the annotator, Claude, claude-opus-5. Edit freely.
  # ----------------------------------------------------------------------------
  - id: reading
    acceptable: []
    must_not:
      - {notify: attention}
      - {notify: critical}
      - {phase: ESCALATED}
      - {strategy: escalate_phone}
      - {strategy: guided_return}
    escalate_by: null
    trigger: null
    rationale: >-
      Jean is sitting up in bed reading at 23:15. She shows no distress and says calmly that she will finish
      her chapter, so she has no need the companion should act on. Holding back is correct. Because she
      stays in bed, the supervision part of AA-05 does not come into play, and nothing points to a need
      under NICE-01 or DICE-01 that would justify handing over to the caregiver. Under NICE-05 the companion
      supports rest without rousing her, and under PCC-02 it respects her own routine, so it should not
      push her back to bed.
    cites: [NICE-05, AA-05, PCC-02, NICE-01, DICE-01]
    reason: ''

  # ----------------------------------------------------------------------------
  # CHECKPOINT lies-down: window t=420-560s (23:22:00-23:24:20)
  # QUESTION: The person lies down to sleep. What should the agent do now?
  # >>> NEEDS YOUR REVIEW <<<
  #   why: must_not differs: only first [none], only second [phase: ENGAGED, phase:
  # ESCALATED]
  # SECOND OPINION: acceptable [phase: IDLE, phase: COOLDOWN]; must_not [say: any, notify:
  # any, phase: ENGAGED, phase: ESCALATED]; escalate_by None from None.
  # ANNOTATOR'S DOUBTS (Claude, claude-opus-5): The acceptable phases assume the companion
  # reaches IDLE or COOLDOWN within 140 s of her lying down. If it stays quietly in
  # OBSERVING for the whole window, it would fail even though it did nothing harmful. A
  # reviewer could decide to leave acceptable empty and judge this checkpoint on must_not
  # only.
  # Labels below: proposed by the annotator, Claude, claude-opus-5. Edit freely.
  # ----------------------------------------------------------------------------
  - id: lies-down
    acceptable:
      - {phase: IDLE}
      - {phase: COOLDOWN}
    must_not:
      - {say: any}
      - {notify: any}
    escalate_by: null
    trigger: null
    rationale: >-
      From t=420 Jean is in bed and lying down, and she is still in bed at t=560. She has settled by herself.
      NICE-05 says a settled person is not roused, so the companion should say nothing, send no notification,
      and wind down to IDLE (COOLDOWN also counts).
    cites: [NICE-05]
    reason: ''
