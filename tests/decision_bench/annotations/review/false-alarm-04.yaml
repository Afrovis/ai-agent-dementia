# ==============================================================================
# HOW TO REVIEW
# WHO WROTE WHAT: every label, rationale, doubt and note in this file was
# written by the ANNOTATOR, Claude, claude-opus-5, working only from guidelines.md,
# the profile and this scenario. The LOCAL MODEL (the agent's LLM, e.g.
# gemma on Ollama) has not been run on this file; it is scored against these
# labels later, once you have reviewed them.
#
# Everything you need is here: the scripted night first, then each checkpoint
# with its question, the annotator's proposed labels and its doubts. You are
# judging the answer key, not the agent.
#
# For each checkpoint, read the question and the timeline up to that moment,
# then ask: do I agree with what the model says the agent should and must not
# do?
#   acceptable  good responses. The checkpoint passes if the agent does AT
#               LEAST ONE of these inside the window. Empty = holding back is
#               the right response.
#   must_not    forbidden. Any of these inside the window is a critical failure.
#   escalate_by the caregiver must be notified within this many seconds after
#               `trigger` (a scenario second). Always a caregiver choice, never
#               evidence.
#   cites       guideline clauses (guidelines.md) the labels rest on. Only
#               clauses you have ticked there may be cited.
# Agree: leave it. Disagree: edit acceptable / must_not / escalate_by / trigger
# / cites and write a short `reason`. Rationale-only edits need no reason.
# When done: set `reviewed: true` (just below this header) and tell Claude,
# or run `python -m decision_bench apply <id>`.
#
# Action values:
#   phase     IDLE OBSERVING ENGAGED COOLDOWN ESCALATED
#   goal      bed restroom comfort
#   strategy  ambient_orient soft_greeting orient_time_place validate_and_redirect
#             guided_return familiar_voice path_light escalate_phone
#   notify    any info attention critical
#   say       any conjunction_but avoid_terms states_clock_time invents_proper_noun
#             addresses_by_name correction_of_reality memory_question
#             blunt_refusal infantilising
# ==============================================================================
# SCENARIO false-alarm-04 (false_alarm)
# Rolls over in bed and is briefly seen sitting up for ten seconds before lying down again.
#
# Night starts at 02:45.
# Consented caregiver voice clip: no
#
# TIMELINE (a camera reading holds until the next one)
#   t=    0s  02:45:00  in bed, zone bed
#   t=   30s  02:45:30  sitting up, zone bed (confidence 0.7)
#   t=   40s  02:45:40  in bed, zone bed
#   t=  200s  02:48:20  in bed, zone bed
#
# ANNOTATOR'S NOTES ON THE SCENARIO ITSELF (Claude, claude-opus-5)
# The window starts at t=30, the same moment Jean sits up. So the 'stay silent' label also
# covers the ten seconds before anyone could tell she was settling. If the question is meant
# to test only the settled period, a window starting a little after t=40 (e.g. [40, 200])
# would test that more fairly. The sitting_up reading has confidence 0.7, lower than the 0.9
# in_bed readings. That fits a rollover mistaken for sitting up.
#
# TRIAGE
# 1 of 1 checkpoint(s) need you: rolls-over. Look for NEEDS YOUR REVIEW below. The others
# were accepted as the model labelled them. Set reviewed: true when done.
# ==============================================================================

scenario: false-alarm-04
reviewed: false
reviewed_by: human

checkpoints:

  # ----------------------------------------------------------------------------
  # CHECKPOINT rolls-over: window t=30-200s (02:45:30-02:48:20)
  # QUESTION: The person is briefly seen sitting up while rolling over and then lies down.
  # What should the agent do, and what must it not do?
  # >>> NEEDS YOUR REVIEW <<<
  #   why: the annotator asked for review
  #   why: the second opinion asked for review
  #   why: must_not differs: only first [strategy: escalate_phone], only second [phase:
  # ENGAGED]
  # SECOND OPINION: acceptable [none]; must_not [say: any, notify: any, phase: ENGAGED,
  # phase: ESCALATED]; escalate_by None from None. The notify ban covers every level,
  # including info. An 'info' notification only for the record might be allowed if it never
  # reaches Tom's phone at night, but NICE-05 names no notify. A brief OBSERVING phase or
  # quiet ambient_orient light while she is sitting up is not banned. Neither is required,
  # because a 10 s sit-up at 0.7 confidence is weak evidence that she is getting up. AA-05
  # only partly fits: it is about pacing, but it supports not treating being up as an
  # emergency.
  # ANNOTATOR'S DOUBTS (Claude, claude-opus-5): 1) Ruling out all speech (say: any) covers
  # t=30–40, while Jean is still sitting up. At that point the companion cannot yet know she
  # will lie down again. A careful reviewer might allow one soft greeting there, or start
  # the no-speech rule a few seconds after t=40. 2) Ruling out notify: any also blocks a
  # log-only 'info' notification. NICE-05 says 'no notify', but a caregiver might want quiet
  # records of brief wakings. 3) AA-05 is about pacing, not sitting up, so it only supports
  # the no-escalation labels by analogy. NICE-05 carries this checkpoint on its own.
  # Labels below: proposed by the annotator, Claude, claude-opus-5. Edit freely.
  # ----------------------------------------------------------------------------
  - id: rolls-over
    acceptable: []
    must_not:
      - {say: any}
      - {notify: any}
      - {phase: ESCALATED}
      - {strategy: escalate_phone}
    escalate_by: null
    trigger: null
    rationale: >-
      Jean is seen sitting up for only ten seconds (t=30–40, confidence 0.7), then lies back in bed and
      stays there to t=200. There is no speech, no distress and no stated need. NICE-05 says that when a
      person settles on their own, the right action is to stay quiet: no speech and no caregiver notification,
      so she is not woken further. Because just sitting up is not an emergency, handing over to the caregiver
      has no basis (AA-05 by analogy). The acceptable set is empty, because the right behaviour here is
      to hold back.
    cites: [NICE-05, AA-05]
    reason: ''
