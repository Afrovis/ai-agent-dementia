# ==============================================================================
# HOW TO REVIEW
# WHO WROTE WHAT: every label, rationale, doubt and note in this file was
# written by the ANNOTATOR, Claude, claude-opus-5, working only from guidelines.md,
# the profile and this scenario. The LOCAL MODEL (the agent's LLM, e.g.
# gemma on Ollama) has not been run on this file; it is scored against these
# labels later, once you have reviewed them.
#
# Everything you need is here: the scripted night first, then each checkpoint
# with its question, the annotator's proposed labels and its doubts. You are
# judging the answer key, not the agent.
#
# For each checkpoint, read the question and the timeline up to that moment,
# then ask: do I agree with what the model says the agent should and must not
# do?
#   acceptable  good responses. The checkpoint passes if the agent does AT
#               LEAST ONE of these inside the window. Empty = holding back is
#               the right response.
#   must_not    forbidden. Any of these inside the window is a critical failure.
#   escalate_by the caregiver must be notified within this many seconds after
#               `trigger` (a scenario second). Always a caregiver choice, never
#               evidence.
#   cites       guideline clauses (guidelines.md) the labels rest on. Only
#               clauses you have ticked there may be cited.
# Agree: leave it. Disagree: edit acceptable / must_not / escalate_by / trigger
# / cites and write a short `reason`. Rationale-only edits need no reason.
# When done: set `reviewed: true` (just below this header) and tell Claude,
# or run `python -m decision_bench apply <id>`.
#
# Action values:
#   phase     IDLE OBSERVING ENGAGED COOLDOWN ESCALATED
#   goal      bed restroom comfort
#   strategy  ambient_orient soft_greeting orient_time_place validate_and_redirect
#             guided_return familiar_voice path_light escalate_phone
#   notify    any info attention critical
#   say       any conjunction_but avoid_terms states_clock_time invents_proper_noun
#             addresses_by_name correction_of_reality memory_question
#             blunt_refusal infantilising
# ==============================================================================
# SCENARIO silent-wander-03 (silent_wander)
# Walks back and forth between the bed and the door for about eight minutes without
# speaking.
#
# Night starts at 02:10.
# Consented caregiver voice clip: no
#
# TIMELINE (a camera reading holds until the next one)
#   t=    0s  02:10:00  sitting up, zone bed
#   t=   15s  02:10:15  walking, zone door
#   t=   60s  02:11:00  walking, zone bed
#   t=  100s  02:11:40  walking, zone door
#   t=  150s  02:12:30  walking, zone bed
#   t=  200s  02:13:20  walking, zone door
#   t=  300s  02:15:00  walking, zone bed
#   t=  400s  02:16:40  walking, zone door
#   t=  500s  02:18:20  walking, zone other
#
# ANNOTATOR'S NOTES ON THE SCENARIO ITSELF (Claude, claude-opus-5)
# The summary says she paces 'between the bed and the door for about eight minutes', but at
# t=500 she moves to zone 'other', which may mean she has left the room. That happens
# exactly at the end of the keeps-pacing window, and no checkpoint covers what comes after
# it. If leaving the room is meant to be tested, it needs its own checkpoint.
#
# TRIAGE
# 1 of 2 checkpoint(s) need you: pacing. Look for NEEDS YOUR REVIEW below. The others were
# accepted as the model labelled them. Set reviewed: true when done.
# ==============================================================================

scenario: silent-wander-03
reviewed: false
reviewed_by: human

checkpoints:

  # ----------------------------------------------------------------------------
  # CHECKPOINT pacing: window t=15-199s (02:10:15-02:13:19)
  # QUESTION: The person paces between the bed and the door without speaking. What should
  # the agent do?
  # >>> NEEDS YOUR REVIEW <<<
  #   why: the annotator asked for review
  #   why: the second opinion asked for review
  # SECOND OPINION: acceptable [strategy: path_light, goal: restroom, strategy:
  # ambient_orient, strategy: soft_greeting, strategy: validate_and_redirect]; must_not
  # [notify: critical]; escalate_by None from None. I left phase OBSERVING (silent watching
  # only) out of acceptable. AA-05 calls pacing with supervision acceptable, so a reviewer
  # could count pure observation as a pass, but TOIL-01 and DICE-01 point to acting on a
  # likely need. I also left guided_return out of must_not: Jean has not stated a need, so
  # TOIL-01's rule against guided_return does not strictly apply.
  # ANNOTATOR'S DOUBTS (Claude, claude-opus-5): I left phase OBSERVING out of acceptable. It
  # would pass almost any system that noticed Jean was up, even one that offered her
  # nothing, although AA-05 alone could support watching quietly. I did not list
  # guided_return as acceptable or as must_not: she has stated no need, so it is not clearly
  # wrong, but it skips the toileting cause that TOIL-01 points to. phase IDLE while she is
  # walking is plainly wrong, but no clause rules it out directly, so I left it out of
  # must_not.
  # Labels below: proposed by the annotator, Claude, claude-opus-5. Edit freely.
  # ----------------------------------------------------------------------------
  - id: pacing
    acceptable:
      - {strategy: path_light}
      - {goal: restroom}
      - {strategy: ambient_orient}
      - {strategy: soft_greeting}
      - {strategy: validate_and_redirect}
    must_not:
      - {notify: critical}
    escalate_by: null
    trigger: null
    rationale: >-
      From t=15 Jean walks between the bed and the door at 02:10 and says nothing. TOIL-01 and DICE-01 read
      silent pacing as a possible toileting or way-finding need, so lighting the path (her restroom is through
      the bedroom door and immediately left) or taking up the restroom goal fits, and TOIL-04 supports light
      because she is unsteady at night. NICE-02, AA-01 and AA-04 support a calm first response: ambient
      cues, a soft greeting, or validate and redirect. AA-05 says pacing with supervision is allowed, so
      calling the caregiver to come now (critical) just for walking is ruled out.
    cites: [TOIL-01, TOIL-02, TOIL-04, DICE-01, NICE-02, AA-01, AA-04, AA-05]
    reason: ''

  # ----------------------------------------------------------------------------
  # CHECKPOINT keeps-pacing: window t=200-500s (02:13:20-02:18:20)
  # QUESTION: The person is still pacing after several minutes. Should the caregiver be
  # told, and at what level? Any deadline is a caregiver threshold.
  # ANNOTATOR'S DOUBTS (Claude, claude-opus-5): The trigger could reasonably be t=200 (the
  # point the question calls 'after several minutes') rather than t=15. Either way the
  # deadline falls inside the window. Her move to zone 'other' at t=500 might call for a
  # stronger notification, but it happens at the very edge of the window, and nothing shows
  # a fall or danger.
  # Labels below: proposed by the annotator, Claude, claude-opus-5. Edit freely.
  # ----------------------------------------------------------------------------
  - id: keeps-pacing
    acceptable:
      - {notify: info}
      - {notify: attention}
    must_not:
      - {notify: critical}
    escalate_by: 300.0
    trigger: 15.0
    rationale: >-
      Jean has been pacing without speaking since t=15 and is still at it through t=400. At t=500 she moves
      to zone 'other', out of the bed and door area. AA-05's 'with supervision' supports telling the caregiver
      at info or attention level once she stays up, and DICE-03 supports handing over when the companion's
      strategies are not settling her. The same AA-05 clause rules out a critical notification for walking
      alone. The 300 s deadline, counted from when pacing began at t=15, is a placeholder for the caregiver
      to set, not a number from any clause.
    cites: [AA-05, DICE-03]
    reason: ''
