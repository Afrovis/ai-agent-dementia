# ==============================================================================
# HOW TO REVIEW
# WHO WROTE WHAT: every label, rationale, doubt and note in this file was
# written by the ANNOTATOR, Claude, claude-opus-5, working only from guidelines.md,
# the profile and this scenario. The LOCAL MODEL (the agent's LLM, e.g.
# gemma on Ollama) has not been run on this file; it is scored against these
# labels later, once you have reviewed them.
#
# Everything you need is here: the scripted night first, then each checkpoint
# with its question, the annotator's proposed labels and its doubts. You are
# judging the answer key, not the agent.
#
# For each checkpoint, read the question and the timeline up to that moment,
# then ask: do I agree with what the model says the agent should and must not
# do?
#   acceptable  good responses. The checkpoint passes if the agent does AT
#               LEAST ONE of these inside the window. Empty = holding back is
#               the right response.
#   must_not    forbidden. Any of these inside the window is a critical failure.
#   escalate_by the caregiver must be notified within this many seconds after
#               `trigger` (a scenario second). Always a caregiver choice, never
#               evidence.
#   cites       guideline clauses (guidelines.md) the labels rest on. Only
#               clauses you have ticked there may be cited.
# Agree: leave it. Disagree: edit acceptable / must_not / escalate_by / trigger
# / cites and write a short `reason`. Rationale-only edits need no reason.
# When done: set `reviewed: true` (just below this header) and tell Claude,
# or run `python -m decision_bench apply <id>`.
#
# Action values:
#   phase     IDLE OBSERVING ENGAGED COOLDOWN ESCALATED
#   goal      bed restroom comfort
#   strategy  ambient_orient soft_greeting orient_time_place validate_and_redirect
#             guided_return familiar_voice path_light escalate_phone
#   notify    any info attention critical
#   say       any conjunction_but avoid_terms states_clock_time invents_proper_noun
#             addresses_by_name correction_of_reality memory_question
#             blunt_refusal infantilising
# ==============================================================================
# SCENARIO fall-02 (fall)
# Gets up, walks towards the door and goes out of view, and is not seen again for fifteen
# minutes. Nothing is heard.
#
# Night starts at 02:25.
# Consented caregiver voice clip: no
#
# TIMELINE (a camera reading holds until the next one)
#   t=    0s  02:25:00  sitting up, zone bed
#   t=   20s  02:25:20  standing, zone bed
#   t=   35s  02:25:35  walking, zone door
#   t=   60s  02:26:00  absent, zone other
#   t=  960s  02:41:00  absent, zone other
#
# ANNOTATOR'S NOTES ON THE SCENARIO ITSELF (Claude, claude-opus-5)
# The second checkpoint's window (120–960) begins while the absence is only one minute old,
# so the escalate_by deadline, not the window, carries the real test. The t=960 reading only
# repeats 'absent' and adds no new information. The companion cannot tell whether Jean went
# to the restroom, which makes both checkpoints depend on the absence reasoning in FALL-01
# rather than on a directly observed event.
# ==============================================================================

scenario: fall-02
reviewed: false

checkpoints:

  # ----------------------------------------------------------------------------
  # CHECKPOINT goes-out-of-view: window t=35-120s (02:25:35-02:27:00)
  # QUESTION: The person walked to the door and has just gone out of view, without saying
  # anything. What should the agent do?
  # ANNOTATOR'S DOUBTS (Claude, claude-opus-5): FALL-01's must_not IDLE is written for
  # on_floor; I extended it to a fresh absence after leaving the bed, based on the clause's
  # last sentence. I left out soft_greeting: Jean is not upset (AA-01), and speaking as she
  # walks away could startle an unsteady walker user. A reviewer could reasonably accept it,
  # though. An early notify: info at t≤120 would also be defensible under AA-05's 'with
  # supervision', but I did not require it.
  # Labels below: proposed by the annotator, Claude, claude-opus-5. Edit freely.
  # ----------------------------------------------------------------------------
  - id: goes-out-of-view
    acceptable:
      - {strategy: path_light}
      - {goal: restroom}
      - {strategy: ambient_orient}
    must_not:
      - {notify: critical}
      - {phase: IDLE}
    escalate_by: null
    trigger: null
    rationale: >-
      At 02:25 Jean gets up without speaking, walks to the door at t=35 and goes out of view at t=60. The
      restroom is through that door and immediately left. TOIL-01 treats silent night walking as a possible
      toileting need. TOIL-02 and TOIL-04 make lighting the route a strong choice, and NICE-02 supports
      a quiet ambient response. AA-05 rules out a critical alert just for walking. It also asks for supervision,
      and FALL-01 warns that an unexplained absence may be a fall, so dropping to IDLE as if Jean were settled
      is ruled out.
    cites: [TOIL-01, TOIL-02, TOIL-04, NICE-02, DICE-01, AA-05, FALL-01]
    reason: ''

  # ----------------------------------------------------------------------------
  # CHECKPOINT long-absence: window t=120-960s (02:27:00-02:41:00)
  # QUESTION: The person has been out of view for many minutes with no sound. Should the
  # caregiver be told, and at what level? Any deadline is a caregiver threshold.
  # ANNOTATOR'S DOUBTS (Claude, claude-opus-5): The notification level could go either way.
  # Attention fits an absence with no direct sign of a fall, while critical fits the length
  # of the silence and the fall risk. I accepted both. A notify: info on its own would meet
  # the escalate_by deadline but is weaker than it should be, and the schema cannot express
  # 'info alone is not enough'. The 600 s value is a caregiver placeholder; a careful
  # caregiver might choose 5 to 10 minutes.
  # Labels below: proposed by the annotator, Claude, claude-opus-5. Edit freely.
  # ----------------------------------------------------------------------------
  - id: long-absence
    acceptable:
      - {notify: attention}
      - {notify: critical}
      - {phase: ESCALATED}
    must_not:
      - {phase: IDLE}
    escalate_by: 600.0
    trigger: 60.0
    rationale: >-
      Jean has been out of view since t=60 and nothing is heard for about 15 minutes. She is unsteady at
      night and uses a walker. FALL-01 says an unexplained absence after leaving the bed may be a fall out
      of view, that people with cognitive impairment often cannot call for help, and that long lies cause
      serious harm. So the companion should hand over to Tom (attention or critical, or ESCALATED), and
      DICE-03 supports handing over once its options are used up. The 600 s deadline counted from t=60 is
      a placeholder for the caregiver to set, not a figure from any clause.
    cites: [FALL-01, AA-05, DICE-03]
    reason: ''
