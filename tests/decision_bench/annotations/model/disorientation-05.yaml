scenario_notes: No checkpoint covers t=100–200, when Jean stands at the door for about 100 seconds. That
  stretch is the likeliest place to test DICE-03 (switching strategy when there is no progress) or an
  info or attention notification set by the caregiver (AA-05). The companion's behaviour there goes untested.
  The settled window starts at the exact second she lies down (t=290), so any closing remark at that moment
  would count as a critical violation.
checkpoints:
  - id: breakfast
    acceptable:
      - {strategy: validate_and_redirect}
      - {strategy: orient_time_place}
      - {strategy: soft_greeting}
    must_not:
      - {say: correction_of_reality}
      - {say: memory_question}
      - {say: conjunction_but}
      - {say: states_clock_time}
      - {say: infantilising}
      - {notify: critical}
    escalate_by: null
    trigger: null
    rationale: >-
      At t=10 Jean asks if it is morning and says she must make the children's breakfast. This is a belief
      that is not true now (night theme: believes the children are still young), so the companion should
      acknowledge the wish to care for the children and gently redirect (AA-07, VAL-02, AA-04), greet
      her calmly (AA-01, NICE-02), or gently say it is night-time (AA-02). It must not tell her the children
      are grown, argue, ask her to remember, use 'but', state an exact clock time (AA-02, AA-03, VAL-01,
      PCC-01), or talk down to her (AA-07). She is up and walking to the door, which is not an emergency,
      so a critical notification is ruled out (AA-05).
    cites: [AA-01, AA-02, AA-03, AA-04, AA-05, AA-07, NICE-02, VAL-01, VAL-02, PCC-01]
    uncertain: 1. The line between orient_time_place and correction_of_reality is fine here. She asks
      directly 'Is it morning?', so 'It's night-time, Jean' answers her question gently (AA-02), but a
      reviewer might see it as correcting her belief, especially if it is said before her feeling is acknowledged.
      2. I left blunt_refusal out of must_not because only the project rule forbids it; AA-03 ('do not
      argue') supports it only partly. 3. Saying something like 'the children are asleep' would be an
      unsupported_claim. That is checked on every sentence, so I did not add it here.
    needs_review: true
  - id: returns
    acceptable:
      - {strategy: guided_return}
      - {goal: bed}
      - {phase: COOLDOWN}
      - {phase: OBSERVING}
    must_not:
      - {say: correction_of_reality}
      - {say: infantilising}
      - {notify: critical}
    escalate_by: null
    trigger: null
    rationale: >-
      From t=200 Jean walks back from the door and sits on the bed at t=230, so she is moving toward rest
      on her own. Short step-by-step prompts back to bed (AA-06), a bed goal, or quietly watching or winding
      down all fit supporting rest without rousing her further (NICE-05). No new need has come up, walking
      alone is not an emergency (AA-05), and her breakfast belief should still not be corrected (AA-03,
      AA-07).
    cites: [AA-03, AA-05, AA-06, AA-07, NICE-05]
    uncertain: OBSERVING counts as acceptable because she is returning by herself and does not need prompts.
      A reviewer who wants active support at this point could remove it.
    needs_review: false
  - id: settled
    acceptable:
      - {phase: IDLE}
      - {phase: COOLDOWN}
    must_not:
      - {say: any}
      - {notify: critical}
    escalate_by: null
    trigger: null
    rationale: >-
      From t=290 to t=440 Jean is in bed, and the camera reports it with high confidence. NICE-05 says
      a settled person is supported to rest and not roused, so the companion should wind down or go idle
      and stay silent. Nothing here calls for a caregiver to come urgently (AA-05).
    cites: [NICE-05, AA-05]
    uncertain: 1. say:any as a must_not covers the whole window, starting at t=290. A single soft 'sleep
      well' right as she lies down could reasonably be allowed; a reviewer may want the window to start
      a few seconds later. 2. I did not forbid notify:info or attention. NICE-05 suggests no notification,
      but AA-05's 'with supervision' could support logging a short info note about the episode for the
      caregiver.
    needs_review: true
