      rationale: >-
        At 07:30 Jean sits up, says a clear, cheerful "Good morning!" and walks around the room and to
        the door with high confidence. He is not on the floor, not absent, not distressed and has stated
        no need. Under AA-05, walking about is not an emergency in itself, so a critical notification
        is ruled out. Acceptable responses are quiet or low-key: standing down or watching, or a short
        warm greeting (NICE-02). Jean's belief that it is morning is true, so a night-time reorientation
        or a push back to bed would contradict his correct reality and override his routine (AA-03, VAL-01,
        PCC-01, PCC-02). The NICE-05 night-rest goal does not apply after he has got up for the day.
