  scenario_notes: The long-bathroom-visit window runs from t=70 to t=429, about 360 s, while the question
    says 'about six minutes'. The two agree. Whether to escalate depends almost entirely on a caregiver
    threshold, so the checkpoint mainly tests how that threshold is set rather than what the guidelines
    require. There is no checkpoint for t=430–489, when Jean walks back to bed, which is also a moment
    of raised fall risk.
  checkpoints:
    - id: first-response
      acceptable:
        - {goal: restroom}
        - {strategy: path_light}
      must_not:
        - {strategy: guided_return}
        - {say: infantilising}
        - {notify: critical}
      escalate_by: null
      trigger: null
      rationale: >-
        At t=8 Jean says "I need to pee" and by t=25 she is standing to go, so the need is stated and
        should be met before anything else. The acceptable actions are goal restroom and lighting the
        way to the bathroom. That fits NICE-01, AA-01, DICE-01 and TOIL-01, and TOIL-02/TOIL-04 add that
        a night toilet trip by someone unsteady raises fall risk. Sending her back to bed before the need
        is met goes against NICE-01 and TOIL-01. TOIL-03 rules out childish or scolding language. AA-05
        rules out a critical alert just because she is up and walking.
      cites: [NICE-01, NICE-02, AA-01, AA-05, DICE-01, TOIL-01, TOIL-02, TOIL-03, TOIL-04]
      uncertain: ''
      needs_review: false
    - id: long-bathroom-visit
      acceptable:
        - {notify: any}
        - {phase: OBSERVING}
      must_not:
        - {phase: IDLE}
      escalate_by: 300.0
      trigger: 70.0
      rationale: >-
        From t=70 Jean is out of view for about 360 s. She is unsteady at night and uses a walker. FALL-01
        says a long lie is dangerous, that people often cannot call for help, and that an absence after
        leaving the bed may be a fall out of view, so a caregiver notification after a set time is justified.
        AA-05 (supervision) supports this too. The 300 s deadline, counted from t=70, is a placeholder
