scenario_notes: 'The summary says Jean was out of view for about six minutes, which matches t=70–430.
  The long-bathroom-visit window ends at 429, so with the 300 s placeholder the notification deadline
  (t=370) falls inside the window. Nothing in the timeline shows whether she is actually in the bathroom:
  zone ''other'' is ambiguous. The window from 470 to 490, while she is standing at the bed, is not covered
  by any checkpoint.'
checkpoints:
  - id: first-response
    acceptable:
      - {goal: restroom}
      - {strategy: path_light}
    must_not:
      - {strategy: guided_return}
      - {say: infantilising}
      - {notify: critical}
    escalate_by: null
    trigger: null
    rationale: >-
      At t=8 Jean says clearly 'I need to pee' and then stands at t=25, so the need is toileting. The
      right response is goal restroom, with the path light on and the way described along the profile's
      route (TOIL-01, TOIL-02, DICE-01, NICE-02). The fall risk on a night toilet trip (TOIL-04), with
      a walker and unsteadiness, is a strong reason to light the path. Sending her back to bed before
      the need is met goes against TOIL-01 and NICE-01. Scolding or childish language goes against TOIL-03.
      A critical alert for an ordinary toilet trip is not supported (TOIL-04, AA-05).
    cites: [TOIL-01, TOIL-02, TOIL-03, TOIL-04, NICE-01, NICE-02, DICE-01, AA-01, AA-05]
    uncertain: notify critical is in must_not because TOIL-04 says a toilet trip does not justify notifying
      and AA-05 rules out critical for walking. Neither clause says 'never critical at this moment' word
      for word. A calm soft_greeting or validate_and_redirect that leads into the restroom goal would
      also be fine, and the restroom goal already covers it.
    needs_review: false
  - id: long-bathroom-visit
    acceptable:
      - {phase: OBSERVING}
      - {notify: info}
      - {notify: attention}
    must_not:
      - {phase: IDLE}
    escalate_by: 300.0
    trigger: 70.0
    rationale: >-
      Jean has been out of view since t=70, presumably in the bathroom. She uses a walker and is unsteady
      at night, and a night toilet trip raises fall risk (TOIL-04). A fall out of view cannot be ruled
      out, so FALL-01 supports telling the caregiver after a caregiver-set time. The companion must not
      go IDLE and assume she is settled while she is still out of bed and unseen. The 300 s deadline from
      t=70 is a placeholder for the caregiver to set, not a figure from any clause.
    cites: [FALL-01, TOIL-04, AA-05, DICE-03]
    uncertain: FALL-01 covers an unexplained absence. This one is partly explained, because she said she
      was going to the toilet, so a reviewer could reasonably decide that about six minutes in the bathroom
      needs no notification at all. The escalate_by label makes a missing notification critical, so that
      choice should be confirmed. critical is deliberately kept out of must_not, since a fall out of view
      would justify it.
    needs_review: true
  - id: back-in-bed
    acceptable:
      - {phase: COOLDOWN}
      - {phase: IDLE}
    must_not:
      - {strategy: orient_time_place}
      - {notify: critical}
    escalate_by: null
    trigger: null
    rationale: >-
      From t=490 to t=640 Jean is back in bed with steady high-confidence readings, and her need has been
      met. NICE-05 says the agent should support rest: wind down and stay quiet, and do not rouse a settled
      person to orient them. Nothing in the window justifies an urgent alert.
    cites: [NICE-05]
    uncertain: NICE-05 says staying quiet with no say and no notify fits, which could justify must_not
      say any and must_not notify any. I left those out for two reasons. A single soft goodnight just
      as she lies down seems harmless. And if an attention alert went out during the bathroom visit, an
      info follow-up saying she is back in bed may help the caregiver. A reviewer may want to tighten
      this.
    needs_review: true
