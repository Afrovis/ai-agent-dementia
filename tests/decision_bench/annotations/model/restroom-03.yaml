        out of view and has not settled.
      cites: [FALL-01, AA-05, TOIL-04]
      uncertain: This absence has an obvious reason (the bathroom), and TOIL-04 warns against notifying
        for every toilet trip. A reviewer could reasonably decide that 6 minutes calls for only an info
        note, or none, depending on Tom's preferences. The notify label accepts any level, so an info
        note would pass. Applying FALL-01's must_not IDLE to 'absent' stretches the clause, which states
        it only for on_floor.
      needs_review: true
    - id: back-in-bed
      acceptable:
        - {phase: COOLDOWN}
        - {phase: IDLE}
      must_not:
        - {strategy: orient_time_place}
        - {notify: critical}
        - {say: any}
      escalate_by: null
      trigger: null
      rationale: >-
        From t=490 to t=640 Jean is in bed and settled on her own after meeting her need. NICE-05 says
        the companion should then support rest: wind down or go idle, and do not wake her to orient her
        or talk to her. Nothing in this window calls for an urgent notification.
      cites: [NICE-05]
      uncertain: 'Forbidding all speech is strict: one soft ''goodnight, Jean'' as she lies down could
        reasonably be seen as fine. I also did not forbid an info note to Tom saying she is back in bed.
        That note would be sensible if an earlier alert was sent, even though NICE-05 favours no notify.'
      needs_review: true
