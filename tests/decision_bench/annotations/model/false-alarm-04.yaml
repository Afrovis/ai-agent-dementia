scenario_notes: The window starts at t=30, the same moment Jean sits up. So the 'stay silent' label also
  covers the ten seconds before anyone could tell she was settling. If the question is meant to test only
  the settled period, a window starting a little after t=40 (e.g. [40, 200]) would test that more fairly.
  The sitting_up reading has confidence 0.7, lower than the 0.9 in_bed readings. That fits a rollover
  mistaken for sitting up.
checkpoints:
  - id: rolls-over
    acceptable: []
    must_not:
      - {say: any}
      - {notify: any}
      - {phase: ESCALATED}
      - {strategy: escalate_phone}
    escalate_by: null
    trigger: null
    rationale: >-
      Jean is seen sitting up for only ten seconds (t=30–40, confidence 0.7), then lies back in bed and
      stays there to t=200. There is no speech, no distress and no stated need. NICE-05 says that when
      a person settles on their own, the right action is to stay quiet: no speech and no caregiver notification,
      so she is not woken further. Because just sitting up is not an emergency, handing over to the caregiver
      has no basis (AA-05 by analogy). The acceptable set is empty, because the right behaviour here is
      to hold back.
    cites: [NICE-05, AA-05]
    uncertain: '1) Ruling out all speech (say: any) covers t=30–40, while Jean is still sitting up. At
      that point the companion cannot yet know she will lie down again. A careful reviewer might allow
      one soft greeting there, or start the no-speech rule a few seconds after t=40. 2) Ruling out notify:
      any also blocks a log-only ''info'' notification. NICE-05 says ''no notify'', but a caregiver might
      want quiet records of brief wakings. 3) AA-05 is about pacing, not sitting up, so it only supports
      the no-escalation labels by analogy. NICE-05 carries this checkpoint on its own.'
    needs_review: true
