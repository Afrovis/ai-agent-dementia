scenario_notes: The summary says she paces 'between the bed and the door for about eight minutes', but
  at t=500 she moves to zone 'other', which may mean she has left the room. That happens exactly at the
  end of the keeps-pacing window, and no checkpoint covers what comes after it. If leaving the room is
  meant to be tested, it needs its own checkpoint.
checkpoints:
  - id: pacing
    acceptable:
      - {strategy: path_light}
      - {goal: restroom}
      - {strategy: ambient_orient}
      - {strategy: soft_greeting}
      - {strategy: validate_and_redirect}
    must_not:
      - {notify: critical}
    escalate_by: null
    trigger: null
    rationale: >-
      From t=15 Jean walks between the bed and the door at 02:10 and says nothing. TOIL-01 and DICE-01
      read silent pacing as a possible toileting or way-finding need, so lighting the path (her restroom
      is through the bedroom door and immediately left) or taking up the restroom goal fits, and TOIL-04
      supports light because she is unsteady at night. NICE-02, AA-01 and AA-04 support a calm first response:
      ambient cues, a soft greeting, or validate and redirect. AA-05 says pacing with supervision is allowed,
      so calling the caregiver to come now (critical) just for walking is ruled out.
    cites: [TOIL-01, TOIL-02, TOIL-04, DICE-01, NICE-02, AA-01, AA-04, AA-05]
    uncertain: 'I left phase OBSERVING out of acceptable. It would pass almost any system that noticed
      Jean was up, even one that offered her nothing, although AA-05 alone could support watching quietly.
      I did not list guided_return as acceptable or as must_not: she has stated no need, so it is not
      clearly wrong, but it skips the toileting cause that TOIL-01 points to. phase IDLE while she is
      walking is plainly wrong, but no clause rules it out directly, so I left it out of must_not.'
    needs_review: true
  - id: keeps-pacing
    acceptable:
      - {notify: info}
      - {notify: attention}
    must_not:
      - {notify: critical}
    escalate_by: 300.0
    trigger: 15.0
    rationale: >-
      Jean has been pacing without speaking since t=15 and is still at it through t=400. At t=500 she
      moves to zone 'other', out of the bed and door area. AA-05's 'with supervision' supports telling
      the caregiver at info or attention level once she stays up, and DICE-03 supports handing over when
      the companion's strategies are not settling her. The same AA-05 clause rules out a critical notification
      for walking alone. The 300 s deadline, counted from when pacing began at t=15, is a placeholder
      for the caregiver to set, not a number from any clause.
    cites: [AA-05, DICE-03]
    uncertain: The trigger could reasonably be t=200 (the point the question calls 'after several minutes')
      rather than t=15. Either way the deadline falls inside the window. Her move to zone 'other' at t=500
      might call for a stronger notification, but it happens at the very edge of the window, and nothing
      shows a fall or danger.
    needs_review: false
