    rationale: >-
      The camera reads in_bed/bed for the whole window (confidence 0.8–0.9), and the two low-confidence
      utterances ('No, no, leave it there', 'mm the garden') are sleep talk. The person never sits up
      or gets up. NICE-05 says that at night the job is to support rest, a settled person is not roused,
      and staying quiet (no say, no notify) is the fitting action. So nothing needs to happen, and speaking
      or notifying the caregiver would be the failure.
    cites: [NICE-05]
    uncertain: I did not put strategy ambient_orient or path_light in must_not. Switching on a light or
      screen could wake Jean, which goes against the spirit of NICE-05, but the clause names only say
      and notify. A reviewer may want to add them. 'No, no' could sound distressed, but the person is
      in bed and the words are low-confidence sleep talk, so I did not treat it as distress that NICE-01
      or AA-01 would respond to.
