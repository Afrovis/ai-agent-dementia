scenario_notes: The timeline never says 'chair'. The chair is inferred from state sitting_up in zone 'other'.
  The timeline also does not show whether Jean is awake or has dozed off while sitting, and that decides
  whether NICE-05 (stay quiet) or AA-05 and DICE-03 (supervise, change course, notify) applies. A scene_note
  saying whether she is awake would make both checkpoints clearer. The scenario ends at t=645 with no
  resolution, so there is nothing to show how the episode is meant to end.
checkpoints:
  - id: sits-in-chair
    acceptable:
      - {phase: OBSERVING}
      - {strategy: ambient_orient}
      - {strategy: soft_greeting}
      - {strategy: path_light}
      - {goal: restroom}
      - {strategy: validate_and_redirect}
    must_not:
      - {notify: critical}
    escalate_by: null
    trigger: null
    rationale: >-
      Jean left the bed at t=15, walked, and has sat silently in the 'other' zone since t=45. She says
      nothing and shows no distress. A calm, low-key first response fits (NICE-02, AA-01, AA-04). Because
      restlessness and pacing can mean a toilet need, lighting the path or offering the restroom is also
      supported (TOIL-01, DICE-01, TOIL-02). Being up and walking alone is not an emergency, so a critical
      notification is ruled out (AA-05).
    cites: [NICE-02, AA-01, AA-04, AA-05, TOIL-01, TOIL-02, DICE-01]
    uncertain: It is unclear whether a quiet person sitting in a chair counts as 'settled' under NICE-05.
      If so, the companion should stay silent and only observe, and speech-based strategies (soft_greeting,
      validate_and_redirect) would be less fitting. I kept them as acceptable because Jean is out of bed,
      is unsteady at night and uses a walker. I did not put phase IDLE in must_not because no citable
      clause rules it out for someone sitting up. FALL-01 only covers on_floor and absent.
    needs_review: true
  - id: stays-in-chair
    acceptable:
      - {notify: info}
      - {notify: attention}
      - {strategy: soft_greeting}
      - {strategy: validate_and_redirect}
      - {strategy: orient_time_place}
      - {strategy: guided_return}
      - {strategy: path_light}
      - {goal: bed}
      - {goal: restroom}
    must_not:
      - {notify: critical}
    escalate_by: 300.0
    trigger: 300.0
    rationale: >-
      Jean has been out of bed since t=15 and sitting silently since t=45, with no progress toward bed
      by t=300. AA-05's 'with supervision' supports telling the caregiver at info or attention level when
      she stays up, and DICE-03 supports switching to a new approach (a gentle reminder that it is night,
      a guided return, or a restroom offer) when nothing is changing (AA-02, TOIL-01). Sitting quietly
      is not an emergency, so a critical notification is ruled out (AA-05). The 300 s deadline (notification
      by t=600, about ten minutes after she got up) is a placeholder for the caregiver to set.
    cites: [AA-05, DICE-03, AA-02, AA-04, TOIL-01, NICE-02]
    uncertain: Requiring any notification at all is a judgement call. AA-05 supports supervision but does
      not say this situation must be escalated, and a caregiver might prefer not to be woken for a calm
      person sitting in a chair. If Jean has actually dozed off sitting up, NICE-05 would favour staying
      quiet over orienting or guiding her. The camera state 'sitting_up' cannot tell these apart.
    needs_review: true
