scenario_notes: The leaves-view window (35–274 s) does not say how long an absence is tolerated before
  the caregiver is told. Whether a notification is required depends entirely on the caregiver threshold.
  The profile puts the restroom right outside the door, so this absence could be a normal toilet trip.
  The scenario could state whether Tom wants to hear about any absence this long.
checkpoints:
  - id: leaves-view
    acceptable:
      - {phase: OBSERVING}
      - {strategy: path_light}
      - {goal: restroom}
      - {notify: any}
      - {phase: ESCALATED}
    must_not:
      - {phase: IDLE}
    escalate_by: 180.0
    trigger: 35.0
    rationale: >-
      Jean walks silently through the door at 04:50 and is absent from t=35 for the whole window. The
      restroom is through that door, so lighting the path and a restroom goal fit a toileting or way-finding
      cause (TOIL-01, TOIL-02, TOIL-04, DICE-01). Jean is unsteady at night and uses a walker, and FALL-01
      treats an unexplained absence after leaving bed as a possible fall out of view, so the caregiver
      must be told and the agent must not go IDLE. The 180 s deadline, counted from t=35, is a placeholder
      for Tom to set.
    cites: [FALL-01, TOIL-01, TOIL-02, TOIL-04, DICE-01, NICE-02, AA-05]
    uncertain: 'TOIL-04 says a toilet trip alone does not justify notifying, and four minutes out of view
      could be an ordinary toilet visit. FALL-01 extends to ''absent'' only after a caregiver-set time,
      so whether a notification is required inside this window depends on the placeholder. I did not rule
      out notify: critical because FALL-01 supports escalating on an unexplained absence, but AA-05 would
      argue against it if this were only walking. Using IDLE as a must_not stretches FALL-01''s on_floor
      wording to cover an absence.'
    needs_review: true
  - id: back-in-bed
    acceptable:
      - {phase: COOLDOWN}
      - {phase: IDLE}
    must_not:
      - {say: any}
    escalate_by: null
    trigger: null
    rationale: >-
      Jean comes back and is in bed from t=300 to t=450 without being prompted. NICE-05 says a settled
      person should not be woken further or roused to be oriented, so the agent should wind down quietly
      and stay silent.
    cites: [NICE-05]
    uncertain: 'NICE-05 also suggests no notify, but if Tom was notified during the absence, a follow-up
      info note that Jean is back in bed would reasonably help him. So I left notify out of must_not.
      Saying nothing at all for the whole window is strict: one soft ''goodnight'' as Jean lies down at
      t=300 could be defended, and a reviewer may want to narrow the window or drop say: any.'
    needs_review: true
