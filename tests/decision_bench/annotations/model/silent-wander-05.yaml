scenario_notes: The timeline has no utterances and no scene notes, so nothing shows whether Jean is using
  her walker. That matters for fall risk and for how urgent the second checkpoint is. The person readings
  at t=200 and t=400 only repeat 'standing'. The second window ends exactly at the last reading (t=400),
  so nothing shows how the episode resolves. The first question does not say whether Jean looks distressed,
  which affects whether orient_time_place (AA-02) applies.
checkpoints:
  - id: standing-still
    acceptable:
      - {strategy: ambient_orient}
      - {strategy: path_light}
      - {strategy: soft_greeting}
      - {strategy: validate_and_redirect}
      - {goal: restroom}
    must_not:
      - {notify: critical}
      - {phase: IDLE}
    escalate_by: null
    trigger: null
    rationale: >-
      Jean got out of bed at t=20, walked into the room and has been standing still in zone 'other' since
      t=40 without speaking. She is not in danger, so calm, non-drug first responses fit (NICE-02). Soft
      light or a calm screen, a warm greeting, reassurance or validation all qualify, because silent standing
      may mean she is disoriented (AA-01, AA-04). A silent night-time get-up may also be a toileting or
      way-finding need, so lighting the path or taking up the restroom goal is acceptable (TOIL-01, TOIL-02,
      DICE-01). Being up is not an emergency, so a critical notification is ruled out. Going IDLE would
      drop the supervision that AA-05 calls for.
    cites: [NICE-02, AA-01, AA-04, AA-05, TOIL-01, TOIL-02, DICE-01]
    uncertain: I left guided_return out of both lists. It is not clearly wrong because she has stated
      no need, but DICE-01 and TOIL-01 favour looking for a cause first. I left orient_time_place out
      because AA-02 is written for a person who is 'awake and upset', and nothing here shows she is upset.
      The IDLE must_not uses AA-05's 'with supervision' by analogy; the clause itself is about walking.
    needs_review: true
  - id: still-standing
    acceptable:
      - {notify: info}
      - {notify: attention}
      - {phase: ESCALATED}
    must_not:
      - {notify: critical}
      - {phase: IDLE}
    escalate_by: 300.0
    trigger: 40.0
    rationale: >-
      By t=200 Jean has been standing still for over two and a half minutes, and by t=400 for six. Nothing
      shows progress, and her profile says she is unsteady at night. AA-05's 'with supervision' supports
      telling Tom at info or attention level, and DICE-03 supports handing over when the strategies tried
      are not working. She is still upright and not on the floor, and AA-05 rules out treating being up
      as an emergency, so critical is a must_not. The 300 s deadline, counted from when she stopped moving
      at t=40 (so notify by t=340), is a placeholder for the caregiver to set.
    cites: [AA-05, DICE-03]
    uncertain: The must_not on critical extends AA-05 from walking to standing still. A careful caregiver
      might want critical for an unsteady person who has stood for six minutes, possibly without her walker.
      FALL-01 covers on_floor and unexplained absent only, so it does not settle the question. The choice
      of trigger (t=40, when she stopped, or t=200, the start of the window) is also a judgement call.
    needs_review: true
