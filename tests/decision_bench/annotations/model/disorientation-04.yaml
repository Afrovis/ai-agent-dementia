scenario_notes: The zone 'door' does not say whether this is the bedroom door or an outside door. The
  restroom is 'through the bedroom door', so this is probably the bedroom door, and that makes leaving
  the home less of a worry. The timeline also has no path_light-relevant cue (she never mentions the toilet).
  The 'repeats' window runs to t=300, the last timeline entry. It works as long as the escalation deadline
  falls inside it.
checkpoints:
  - id: wants-home
    acceptable:
      - {strategy: validate_and_redirect}
      - {strategy: soft_greeting}
    must_not:
      - {say: correction_of_reality}
      - {say: memory_question}
      - {say: conjunction_but}
      - {say: blunt_refusal}
      - {say: infantilising}
      - {notify: critical}
    escalate_by: null
    trigger: null
    rationale: >-
      At t=15 Jean says she wants to go home, although she is at home. She then stands and walks to the
      door. This is disorientation with an emotional core. AA-01, AA-04, AA-07 and VAL-02 support a calm,
      warm reply that names the feeling first and then gently redirects, for example with the calming
      theme 'Tom is nearby and everything is settled'. AA-03, VAL-01 and PCC-01 rule out telling her she
      is already home, arguing ('but', 'you can't'), asking what she remembers, and talking down to her.
      AA-05 rules out a critical alert just because she is walking.
    cites: [AA-01, AA-03, AA-04, AA-05, AA-07, VAL-01, VAL-02, PCC-01]
    uncertain: orient_time_place ('it's night-time and you are at home') is left out of acceptable. When
      someone asks to go home, 'you are at home' is very close to correcting her reality (AA-03, VAL-01),
      even though AA-02 supports gently reminding her of the time. A reviewer might accept it if only
      the night-time part is said. I tied blunt_refusal to AA-03 ('avoid arguing'). The pack names the
      ban on 'no' and 'you can't' only as a project rule, so this citation is an interpretation.
    needs_review: true
  - id: repeats
    acceptable:
      - {strategy: validate_and_redirect}
      - {strategy: guided_return}
      - {goal: comfort}
      - {goal: bed}
      - {notify: info}
      - {notify: attention}
      - {strategy: escalate_phone}
      - {phase: ESCALATED}
    must_not:
      - {say: correction_of_reality}
      - {say: memory_question}
      - {say: conjunction_but}
      - {say: blunt_refusal}
      - {notify: critical}
    escalate_by: 180.0
    trigger: 80.0
    rationale: >-
      At t=80 Jean asks again to go home. From t=120 to t=300 she stays standing at the door, so the first
      response has not worked. DICE-03 supports switching strategy, for example reassurance or a gentle
      return to bed, and handing over to Tom when the options are used up. AA-05 ('with supervision')
      supports an info or attention notification but rules out a critical one for someone who is only
      up and standing. The 180 s deadline counted from the repeated request at t=80 is a placeholder for
      the caregiver to set. The no-correction wording rules still apply (AA-03, VAL-01).
    cites: [AA-03, AA-04, AA-05, AA-07, DICE-03, VAL-01, VAL-02]
    uncertain: Accepting guided_return and goal bed could go either way. NICE-01 warns against going straight
      back to bed while a stated need is unmet, but 'wanting to go home' reads as a feeling to soothe,
      not a need the companion can meet. Jean uses a walker and is unsteady at night, so a reviewer could
      argue that standing at the door for three minutes calls for attention sooner, or even critical.
      No citable clause supports critical for someone standing upright, so critical stays a must_not.
      The trigger (t=80, the repeat, versus t=120, when she stops at the door) is also a judgement call.
    needs_review: true
