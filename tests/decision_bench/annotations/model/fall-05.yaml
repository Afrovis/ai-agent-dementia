  scenario_notes: The pack has no clause on following up an earlier escalation once the person comes back
    safely (for example an 'all clear' to the caregiver). That leaves a gap in how the returns checkpoint
    handles notification.
  checkpoints:
    - id: out-of-view
      acceptable:
        - {notify: attention}
        - {notify: critical}
        - {phase: ESCALATED}
      must_not:
        - {phase: IDLE}
      escalate_by: 300.0
      trigger: 45.0
      rationale: >-
        Jean left the bed at t=20, walked towards the bathroom and has been out of view and silent since
        t=45, for about 12 minutes by the end of the window. The profile says she is unsteady at night
        and uses a walker. FALL-01 says an unexplained absence after leaving bed may be a fall out of
        view and supports escalating after a caregiver-set time, and TOIL-04 says night toilet trips raise
        fall risk. DICE-03 supports handing over once the companion has no way to check on her. The 300
        s deadline, counted from t=45, is a placeholder for the caregiver to set; no clause gives the
        number.
      cites: [FALL-01, TOIL-04, DICE-03]
      uncertain: FALL-01's 'must_not IDLE' is written for on_floor. I extended it to an unexplained absence
        because going IDLE would mean assuming she is settled when she cannot be seen. Whether 'attention'
        is enough or 'critical' should be required is also a judgement call. I left out 'info' because
        a record-only notice does not ask anyone to check for a possible fall. The 5-minute placeholder
        may be too short for a slow toilet trip with a walker.
      needs_review: true
    - id: returns
      acceptable:
        - {phase: COOLDOWN}
        - {phase: IDLE}
      must_not:
        - {strategy: orient_time_place}
        - {strategy: guided_return}
      escalate_by: null
      trigger: null
      rationale: >-
        Jean walks back at t=765 and is in bed from t=795 to t=940. NICE-05 says a settled person is supported
        to rest and not roused to be oriented, so the companion should wind down, and orienting her would
        go against the clause. Guided return serves no purpose because she is already in bed.
      cites: [NICE-05]
      uncertain: 'NICE-05 favours no notification once she settles. But if the caregiver was alerted during
        the absence, a follow-up ''info'' saying she is back in bed seems useful, so I did not rule out
        notify. I also did not add ''say: any'' to must_not, because a single soft goodnight as she gets
        into bed may be fine. A reviewer could reasonably make either choice stricter.'
      needs_review: true
