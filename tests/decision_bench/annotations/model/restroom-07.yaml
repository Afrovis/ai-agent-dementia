scenario_notes: The lies-back-down window starts at t=50, the moment Jean speaks, but she is still sitting
  up until t=65. Because of that, the checkpoint cannot tell a brief acknowledgement apart from rousing
  her once she is settled. Splitting it into 50–64 and 65–240 would make the labels sharper.
checkpoints:
  - id: stated-need
    acceptable:
      - {goal: restroom}
      - {strategy: path_light}
      - {strategy: validate_and_redirect}
    must_not:
      - {strategy: guided_return}
      - {say: infantilising}
      - {notify: critical}
    escalate_by: null
    trigger: null
    rationale: >-
      At t=10 Jean says she should go to the bathroom and is still sitting up on the bed. TOIL-01 and
      NICE-01 put meeting this need first, so the expected response is goal: restroom. Lighting the route
      (TOIL-02, TOIL-04; Jean is unsteady at night and uses a walker) or calmly acknowledging the wish
      and suggesting the next step (AA-01, NICE-02) also count. Steering her back to bed while the need
      is unmet goes against TOIL-01 and NICE-01. Toileting talk must stay matter-of-fact (TOIL-03). A
      critical alert is not warranted for a routine toilet trip (TOIL-04, AA-05).
    cites: [TOIL-01, TOIL-02, TOIL-03, TOIL-04, NICE-01, NICE-02, AA-01, AA-05]
    uncertain: validate_and_redirect is accepted on the assumption that it points her toward the toilet.
      If the companion uses it to steer her back to bed, it will still pass this checkpoint unless guided_return
      is also recorded.
    needs_review: false
  - id: lies-back-down
    acceptable:
      - {phase: COOLDOWN}
      - {phase: IDLE}
    must_not:
      - {notify: critical}
      - {notify: attention}
      - {say: infantilising}
    escalate_by: null
    trigger: null
    rationale: >-
      At t=50 Jean says she is too tired and will go later. By t=65 she is in bed, and she is still in
      bed at t=240. NICE-05 says a person who settles on their own should not be roused, so the companion
      should wind down (COOLDOWN or IDLE) and not ask for the caregiver's attention. Pushing or scolding
      her about the toilet would break TOIL-03 and AA-07. Nothing here calls for escalation.
    cites: [NICE-05, TOIL-03, AA-07]
    uncertain: 'I did not require silence (say: any) for the whole window: one short, calm acknowledgement
      at t=50, while she is still sitting up, seems reasonable, but a reviewer might want silence required
      from t=65. path_light was left out of must_not because a light switched on in the first checkpoint
      may still be on at t=50. Switching it on after she has lain down would rouse her, against NICE-05.
      An info-level note to Tom that a toilet need is still unmet might be useful. NICE-05 argues against
      any notify, so I banned only attention and critical. Whether info is acceptable is for the caregiver
      to decide.'
    needs_review: true
