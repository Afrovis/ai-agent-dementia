  scenario_notes: 'The lies-back-down window (50–240) covers two different situations. From t=50 to t=65
    Jean is still sitting up and talking. From t=65 onward she has settled in bed. A brief reply is fine
    in the first part, while NICE-05 calls for silence in the second, so one set of labels cannot test
    both. Splitting the window at about t=65–75 would let a ''must_not say: any'' label apply to the settled
    period. Also, the timeline ends at t=240, so nothing shows whether she needs the toilet again later.'
  checkpoints:
    - id: stated-need
      acceptable:
        - {goal: restroom}
        - {strategy: path_light}
      must_not:
