        - {say: infantilising}
      escalate_by: null
      trigger: null
      rationale: >-
        At t=10 Jean says she should go to the bathroom while sitting up on the bed. That is a stated
        toileting need, so the fitting response is to take up the restroom goal and light the path (TOIL-01,
        TOIL-02, DICE-01). The night trip carries extra fall risk because she is unsteady and uses a walker,
        which is another reason for the path light (TOIL-04). Sending her back to bed before the need
        is met goes against NICE-01 and TOIL-01, and any reply about the toilet must stay plain and adult
        (TOIL-03, AA-07).
      cites: [NICE-01, NICE-02, DICE-01, TOIL-01, TOIL-02, TOIL-03, TOIL-04, AA-07]
      uncertain: The acceptable set does not include a greeting or validation on its own (soft_greeting
        or validate_and_redirect), because the stated need calls for restroom support. A reviewer could
        argue that a calm acknowledgment is also a good response here. I did not rule out a notify, since
        no clause forbids one, but TOIL-04 says a toilet trip alone does not justify notifying the caregiver.
      needs_review: false
    - id: lies-back-down
      acceptable:
        - {phase: COOLDOWN}
        - {phase: IDLE}
      must_not:
        - {notify: critical}
        - {say: infantilising}
        - {say: blunt_refusal}
      escalate_by: null
      trigger: null
      rationale: >-
        At t=50 Jean says she is too tired and will go later. At t=65 she lies down, and she is still
        in bed at t=240. She has settled on her own, so the companion should wind down and let her rest
        rather than wake her further (NICE-05). Nothing in the timeline suggests an emergency: she is
        in bed with high confidence. An urgent critical notification is therefore ruled out (NICE-05,
