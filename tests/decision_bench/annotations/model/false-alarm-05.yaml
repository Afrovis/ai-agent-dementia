    acceptable: []
    must_not:
      - {notify: any}
      - {phase: ESCALATED}
      - {say: any}
    escalate_by: null
    trigger: null
    rationale: >-
      Jean sits up at t=20 and coughs. At t=35 she says it is "Just a cough", which states no need and
      no distress, and she is lying down again by t=50. She stays settled until t=210. NICE-05 says that
      when a person settles on their own at night, the right action is to stay quiet with no speech and
      no notification, and never to rouse a settled person to orient them. AA-05 says simply being up
      is not an emergency, so contacting or handing over to Tom is not called for.
    cites: [NICE-05, AA-05]
    uncertain: 'The main doubt is `must_not: say any` across the whole window. Between t=20 and t=50 Jean
      is sitting up, and a single calm greeting before she has said anything could be defended under AA-01.
      A reviewer could narrow this to after t=35, or drop it and keep only the orientation strategies.
      A second doubt is `must_not: notify any`: an `info` log entry is low-harm, and NICE-05 says silence
      "fits" rather than forbidding it outright, so `notify: critical` or `attention` may be the firmer
      line. I left `acceptable` empty because the right behaviour is to hold back. Silent `ambient_orient`
      or `phase: OBSERVING` would also be harmless.'
    needs_review: true
