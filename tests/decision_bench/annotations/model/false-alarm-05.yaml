scenario_notes: The window starts at t=20, the same moment Jean sits up. So any immediate reaction to
  her sitting up is judged under the strict silence label, before she says at t=35 that it is just a cough.
  If the goal is to test only what happens after she has explained, the window could start at t=35.
checkpoints:
