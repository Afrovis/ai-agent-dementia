scenario_notes: The timeline has no reading for t=200–240, when Jean is walking in zone 'other' before
  returning to bed. No checkpoint covers that stretch, even though that is when she leaves the camera's
  main zones and she is unsteady at night. The waits-at-door window ends at 199, just before she moves
  on to 'other'.
checkpoints:
  - id: asks-for-husband
    acceptable:
      - {strategy: validate_and_redirect}
      - {strategy: soft_greeting}
      - {strategy: orient_time_place}
    must_not:
      - {say: correction_of_reality}
      - {say: memory_question}
      - {say: conjunction_but}
      - {say: infantilising}
      - {say: avoid_terms}
      - {notify: critical}
    escalate_by: null
    trigger: null
    rationale: >-
      At t=20 Jean asks where her husband is and says he should be home by now. The profile says her spouse
      has died and that she looks for him at night. The companion should respond calmly to the worry behind
      the question (AA-01, AA-04, AA-07, VAL-02). Gently saying it is night-time is also supported (AA-02).
      Telling her he has died, or asking her whether she remembers, invalidates her reality (AA-03, VAL-01,
      PCC-01, PCC-02). The hospital is on her avoid list, and it could easily come up when talking about
      a death (NICE-04). She is only sitting up and asking a question, so a critical alert is not justified
      (AA-05).
    cites: [AA-01, AA-02, AA-03, AA-04, AA-07, VAL-01, VAL-02, PCC-01, PCC-02, NICE-02, NICE-04, AA-05]
    uncertain: 'A reply like ''he''ll be home soon'' is an unsupported claim about a dead spouse, and
      it might be the most important wording to rule out here. But no citable clause specifically addresses
      false reassurance, so I did not add `unsupported_claim` to must_not. The general wording check will
      still catch it. I also hesitated over orient_time_place: on its own it answers the facts rather
      than her feeling (VAL-02), but AA-02 explicitly supports it.'
  - id: waits-at-door
    acceptable:
      - {strategy: validate_and_redirect}
      - {strategy: soft_greeting}
      - {strategy: orient_time_place}
      - {strategy: ambient_orient}
      - {notify: info}
      - {notify: attention}
    must_not:
      - {notify: critical}
      - {say: correction_of_reality}
      - {say: conjunction_but}
      - {say: blunt_refusal}
      - {say: infantilising}
    escalate_by: 120.0
    trigger: 70.0
    rationale: >-
      Jean walks to the door and says at t=70 that she will wait there for her husband. She then stands
      at the door until t=200. Being up and walking is not an emergency, so she should be supervised and
      not sent a critical alert (AA-05). The companion should reassure her and respond to her wish without
      arguing, correcting her or forbidding her (AA-03, AA-04, AA-07, VAL-01, PCC-01). Calm speech or
      ambient light and a calm screen are first-line responses (NICE-02). If she stays up, AA-05's 'with
      supervision' supports an info or attention notice to Tom. The 120 s deadline from t=70 is a placeholder
      for the caregiver to set, not a number from any clause.
    cites: [AA-03, AA-04, AA-05, AA-07, VAL-01, VAL-02, PCC-01, NICE-02, DICE-03]
    uncertain: 'The mandatory escalate_by is a judgement call. She is not in danger, but the profile says
      she is unsteady at night and uses a walker, and she stays at the door for more than two minutes.
      A caregiver may prefer a longer threshold or none. I listed guided_return as neither acceptable
      nor forbidden: it is reasonable after validation, but it is second-best if it is the first response.
      I put blunt_refusal under AA-03 (''avoid arguing''), which only partly fits.'
  - id: back-to-bed
    acceptable:
      - {phase: COOLDOWN}
      - {strategy: ambient_orient}
      - {strategy: guided_return}
    must_not:
      - {notify: critical}
      - {say: correction_of_reality}
      - {say: conjunction_but}
    escalate_by: null
    trigger: null
    rationale: >-
      At t=240 Jean returns and sits on the bed, and she is still sitting there at t=300. The episode
      is resolving on its own. The companion should wind down, or at most offer gentle, low-key help to
      lie down, and not rouse her further (NICE-05, NICE-02). Walking alone and returning is not an emergency,
      so a critical alert is ruled out (AA-05). Not correcting her about her husband still applies (AA-03).
    cites: [NICE-05, NICE-02, AA-05, AA-03]
    uncertain: 'She is sitting up, not lying down. So it is unclear whether a gentle guided_return prompt
      or complete silence fits best, and I accepted both. I did not add `say: any` to must_not for the
      same reason. Whether IDLE is acceptable this soon is also debatable, so I left it out.'
