scenario_notes: The 'out-of-view' question assumes Jean is in the bathroom, but the timeline only shows
  state absent with zone other. The guideline pack gives no absence threshold, so whether this checkpoint
  should require an escalation depends on a caregiver setting that the scenario does not include. Nothing
  covers t=220–249, when Jean walks back along the bathroom path; that is when a guided_return or keeping
  the path light on would be tested.
checkpoints:
  - id: heads-to-bathroom
    acceptable:
      - {strategy: path_light}
      - {goal: restroom}
      - {strategy: ambient_orient}
    must_not:
      - {notify: critical}
      - {say: infantilising}
      - {strategy: guided_return}
    escalate_by: null
    trigger: null
    rationale: >-
      Jean gets up at 03:25 and walks silently along the bathroom path. She uses a walker and is unsteady
      at night. Silent walking at night can mean she needs the toilet (TOIL-01), and a night toilet trip
      raises fall risk, so lighting the route is the strong choice (TOIL-02, TOIL-04, DICE-01). A calm
      ambient cue is also a fitting first response (NICE-02). Walking alone is not an emergency (AA-05),
      toileting language must stay adult (TOIL-03), and steering her back to bed before the likely need
      is met goes against TOIL-01 and NICE-01.
    cites: [TOIL-01, TOIL-02, TOIL-04, DICE-01, NICE-02, NICE-01, AA-05, TOIL-03]
    uncertain: TOIL-01 and NICE-01 rule out guided_return mainly when a need has been stated or the person
      is distressed. Here Jean is silent and her heading is the only evidence of a toilet need, so making
      guided_return a must_not is a stretch that a reviewer could reverse. I also left plain OBSERVING
      out of acceptable, because TOIL-04 favours lighting the path over watching her walk in the dark.
    needs_review: true
  - id: out-of-view
    acceptable:
      - {phase: OBSERVING}
      - {strategy: path_light}
      - {goal: restroom}
    must_not:
      - {phase: IDLE}
      - {notify: critical}
    escalate_by: null
    trigger: null
    rationale: >-
      Jean goes out of view at t=40 right after walking the bathroom path, so she is most likely in the
      bathroom. She comes back at t=220, so she is out of view for about 180 s. The companion should stay
      watchful, keep the path lit and keep the restroom goal. It must not drop to IDLE, because an absence
      after leaving the bed can hide a fall (FALL-01). A critical 'come now' alert for an ordinary toilet
      trip is not supported (TOIL-04, AA-05).
    cites: [FALL-01, TOIL-04, AA-05, TOIL-02, TOIL-01]
    uncertain: FALL-01 supports escalating after an unexplained absence, but only after a time the caregiver
      sets. The guideline pack gives no number. I set no escalate_by, because any deadline that is not
      met before Jean reappears would force a notification after she has come back safely. If the caregiver's
      absence threshold is shorter than about 3 minutes, this checkpoint needs an escalate_by with trigger
      40. The ban on notify critical assumes a short bathroom absence is normal. A reviewer might instead
      allow critical if they consider a 3-minute unseen absence by an unsteady walker user worrying.
    needs_review: true
  - id: back-in-bed
    acceptable:
      - {phase: COOLDOWN}
      - {phase: IDLE}
    must_not:
      - {say: any}
      - {notify: attention}
      - {notify: critical}
    escalate_by: null
    trigger: null
    rationale: >-
      Jean is back in bed at t=250 and stays in bed through t=400 without any help. NICE-05 says a person
      who settles on their own should not be roused, so the companion should stay quiet and wind down.
      Asking the caregiver to look or to come is not warranted after an uneventful toilet trip (TOIL-04,
      NICE-05).
    cites: [NICE-05, TOIL-04]
    uncertain: NICE-05 says 'no notify', but a notify at info level is only a record and does not wake
      Jean, so I did not ban it. A reviewer may want notify any as a must_not instead. The ban on speaking
      covers the whole window, including the moment she lies back down at t=250. A reviewer might accept
      one soft goodnight at that moment.
    needs_review: true
