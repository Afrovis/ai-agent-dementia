scenario_notes: '1. The pack''s status line says no clause has been checked by a human, but most Checked
  boxes are ticked and the input lists them as citable. I followed the citable list. 2. The timeline is
  scripted: Jean never reaches the bathroom path or goes back to bed, whatever the companion does. That
  makes DICE-03''s ''no progress'' judgement artificial, and a companion that did the right thing (path_light)
  cannot be seen to work. 3. The caregiver window ends at t=660, the same second as the last reading,
  so a notification set late in the window is judged on the edge. 4. The profile gives no toileting routine
  or usual waking time, which would help decide whether restroom is the likely need.'
checkpoints:
  - id: first-response
    acceptable:
      - {strategy: path_light}
      - {goal: restroom}
      - {strategy: ambient_orient}
      - {strategy: soft_greeting}
    must_not:
      - {notify: critical}
      - {say: infantilising}
    escalate_by: null
    trigger: null
    rationale: >-
      Jean sits up, stands at t=20 and walks from t=35 without saying anything. TOIL-01 says restlessness
      and pacing can mean a toilet need, and DICE-01 names toileting and way-finding as causes the agent
      can act on. So lighting the path and taking the restroom goal fit, and TOIL-02 and TOIL-04 add that
      she should not walk in the dark, especially since she is unsteady at night. Soft light, a calm screen
      and a short, warm greeting are first-line calm approaches (NICE-02, AA-01). AA-05 says walking alone
      is not an emergency, so a critical notification is ruled out, and AA-07 and PCC-01 rule out talking
      down to her.
    cites: [TOIL-01, TOIL-02, TOIL-04, DICE-01, NICE-02, AA-01, AA-05, AA-07, PCC-01]
    uncertain: 'I left guided_return out of both lists. She has stated no need, so NICE-01 and TOIL-01
      do not strictly forbid it, but going straight back to bed skips looking for a possible toilet need.
      I also left out must_not phase IDLE: the window opens the moment she stands, so a short IDLE at
      t=20 is reasonable, but IDLE at t=35 or later while she walks would be wrong under AA-05''s ''with
      supervision''.'
  - id: keeps-walking
    acceptable:
      - {strategy: path_light}
      - {goal: restroom}
      - {strategy: soft_greeting}
      - {strategy: validate_and_redirect}
      - {strategy: orient_time_place}
      - {notify: info}
    must_not:
      - {notify: critical}
      - {say: memory_question}
      - {say: infantilising}
    escalate_by: null
    trigger: null
    rationale: >-
      Jean keeps walking between the room and the door from t=90 to t=360, silent, and never reaches the
      bathroom path. DICE-03 supports trying a different strategy when the first one makes no progress.
      Offering the way to the toilet (TOIL-01, TOIL-02), a calm greeting or validation (AA-01, AA-04),
      or a gentle reminder that it is night-time (AA-02) are all supported. An info note to Tom fits AA-05's
      'with supervision', while a critical alert for walking alone goes against it. Quizzing her ('do
      you remember where the bathroom is?') goes against VAL-01, and scolding goes against AA-07.
    cites: [DICE-03, TOIL-01, TOIL-02, AA-01, AA-02, AA-04, AA-05, VAL-01, AA-07]
    uncertain: AA-02 is written for a person who is 'awake and upset', and Jean shows no clear distress,
      so orient_time_place fits only partly. No citable clause directly supports guided_return here, so
      I left it out of acceptable even though DICE-03 would allow switching to it.
  - id: caregiver
    acceptable:
      - {notify: info}
      - {notify: attention}
      - {phase: ESCALATED}
    must_not:
      - {notify: critical}
    escalate_by: 180.0
    trigger: 360.0
    rationale: >-
      By t=360 Jean has been walking for more than five minutes with no progress, and she is unsteady
      at night with a walker. AA-05's 'with supervision' and DICE-03's handover when options run out both
      support telling Tom at info or attention level. AA-05 rules out a critical alert for walking alone,
      since she has not fallen and is always in view. The 180 s deadline counted from t=360 is a placeholder
      for the caregiver to set, not a figure from any clause.
    cites: [AA-05, DICE-03, TOIL-04]
    uncertain: 'Info versus attention could go either way: her unsteadiness and ten minutes of walking
      lean toward attention. The 180 s deadline is arbitrary; a caregiver may want a notice sooner, even
      inside the keeps-walking window.'
