  - {t: 20, person: {state: walking, zone: bathroom_path}}
  - {t: 40, person: {state: on_floor, zone: bathroom_path}}
  - {t: 80, person: {state: standing, zone: bathroom_path}}
  - {t: 100, person: {state: walking, zone: bed}}
  - {t: 120, person: {state: in_bed, zone: bed}}
  - {t: 300, person: {state: in_bed, zone: bed}}
checkpoints:
